name: PRO physical Qwen3.5-9B FK-only paired EX on 32 novel BIRD TRAIN cases

on:
  push:
    branches: [experiment/bird-implicit-fk-grounding-v1-20261117]
    paths:
      - experiments/qwen9b_fk32_prospective.py
      - tests/test_qwen9b_fk32_prospective.py
      - .github/workflows/pro-qwen9b-birdtrain-fk32-paired.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qwen9b-paired:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Test source-only intervention boundaries / strict model result gate
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_implicit_fk_grounding.py tests/test_qwen9b_fk32_prospective.py
      - name: Recover exact prospectively frozen BIRD TRAIN32 before any inference
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43904889296
          github-token: ${{ github.token }}
          name: qwen9b-fk-correction-prospective-source32-frozen
          path: immutable-fk32
      - name: Check source SHA and pre-inference registration status
        run: |
          set -euo pipefail
          echo "ee1b5035302d36a1241952bd2e5acd3dfc2518d1fba2581f557e04e179960535  immutable-fk32/prospective32.jsonl" | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('immutable-fk32/freeze.json').read_text())
          assert j['status']=='FROZEN_BEFORE_INFERENCE' and j['n']==32
          assert j['physical_databases']==4 and j['excluded_previous_databases']==20
          assert j['model_inference_occurred'] is False
          print("FK32_PROSPECTIVELY_REGISTERED_SOURCE_VERIFIED")
          PY
      - name: Start unchanged Qwen3.5-9B pinned CPU model
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 2
          done
          ollama pull qwen3.5:9b-q4_K_M
      - name: Genuine matched identical-Qwen, original FK vs physical PK-corrected FK
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python -m experiments.qwen9b_fk32_prospective \
            --cohort immutable-fk32/prospective32.jsonl \
            --meta immutable-fk32/freeze.json \
            --shard "$SHARD" \
            --work original-physical-sqlite \
            --output "fk32-paired-shard-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen9b-fk32-paired-shard-${{ matrix.shard }}
          path: fk32-paired-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    if: always()
    needs: qwen9b-paired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qwen9b-fk32-paired-shard-*
          path: paired-shards
          merge-multiple: true
      - name: Require 32/32 prospectively registered original paired cases before any gain claim
        run: |
          set -euo pipefail
          python -m experiments.qwen9b_fk32_prospective \
            --inputs paired-shards/fk32-paired-shard-*.json \
            --output fk32-prospective-32-complete.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen9b-fk32-prospective-complete
          path: fk32-prospective-32-complete.json
          if-no-files-found: warn
          retention-days: 30
