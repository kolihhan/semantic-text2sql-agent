name: Qwen9B BIRD100 fixed projection-only correction source-pinned offline
on:
  workflow_dispatch:
  push:
    branches: [experiment/bird100-fixed-projection-replay-20261115]
    paths: [.github/workflows/bird100-fixed-projection-offline.yml]
permissions:
  contents: read
  actions: read
env:
  BIRD_SOURCE_LF_SHA256: ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb
  BIRD_DB_ZIP_SHA256: cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Test replay behavior; same read-only SQL executor, no model
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_projection_repair.py tests/test_projection_bird100_replay.py
      - name: Download original 2026-10-05 Qwen9B generated candidate JSON, never rerun LLM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 37307108955
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: qwen9b-xiyan-style-shard-${{ matrix.shard }}
          path: inputs
      - name: Download and verify BIRD original source and physical SQLite DBs
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/3c11fb193e5439b338e23677fa0aae11e8b85db9/data/dev_20251106-00000-of-00001.json?download=true -o inputs/source.json
          echo "$BIRD_SOURCE_LF_SHA256  inputs/source.json" | sha256sum -c -
          curl -fsSL --retry 4 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o inputs/dev.zip
          echo "$BIRD_DB_ZIP_SHA256  inputs/dev.zip" | sha256sum -c -
          mkdir -p inputs/bird/unpacked inputs/bird/databases
          unzip -q inputs/dev.zip -d inputs/bird/unpacked
          DB_ZIP="$(find inputs/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)"
          test -n "$DB_ZIP"
          unzip -q "$DB_ZIP" -d inputs/bird/databases
          DB_ROOT="$(find inputs/bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)"
          if [ -z "$DB_ROOT" ]; then DB_ROOT=inputs/bird/databases; fi
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
      - name: Read-only Qwen BIRD100 historical frozen projections, no new generation
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python -m evaluation.projection_bird100_replay \
            --source inputs/source.json \
            --artifact "inputs/qwen9b-shard-$SHARD.json" \
            --db-root "$DB_ROOT" \
            --shard "$SHARD" \
            --output "bird100-projection-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bird100-projection-${{ matrix.shard }}
          path: bird100-projection-*.json
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    needs: replay
    if: ${{ always() && needs.replay.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bird100-projection-*
          path: shards
          merge-multiple: true
      - name: Strict historical Guarded BIRD100 paired projection EX; preserve invalid provenance
        run: |
          set -euo pipefail
          python -m evaluation.projection_bird100_replay \
            --inputs shards/bird100-projection-0.json \
                     shards/bird100-projection-1.json \
                     shards/bird100-projection-2.json \
                     shards/bird100-projection-3.json \
            --output bird100-projection-aggregate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bird100-projection-aggregate
          path: bird100-projection-aggregate.json
          if-no-files-found: error
          retention-days: 30
