name: Qwen9B Spider DEV12 CPU physical postmortem, source/reference case check
on:
  workflow_dispatch:
  push:
    branches: [experiment/qwen9b-physical-value-evidence-20261115]
    paths: [.github/SQL_SPIDER12_PHYSICAL_AUDIT_START]
permissions:
  contents: read
  actions: read
env:
  SPIDER_SHA256: 00636695dabed6b5f4b8328a16b13e069a2f16591d5efcce57660669c85b121b
jobs:
  physical-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Validate source and script syntax, no model training/inference
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q evaluation/audit_spider12_failures.py
          python -m pytest -q tests/test_qwen_value_evidence_spider12.py
      - name: Fetch exact independent Spider DEV archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/spider
          curl -fL --retry 4 --retry-delay 5 https://huggingface.co/datasets/HAL-9001/spider-databases/resolve/main/spider_data.zip -o /tmp/spider/source.zip
          echo "$SPIDER_SHA256  /tmp/spider/source.zip" | sha256sum -c -
          unzip -q /tmp/spider/source.zip -d /tmp/spider/extract
          DEV_JSON="$(find /tmp/spider/extract -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)"
          TRAIN_JSON="$(find /tmp/spider/extract -type f -name train_spider.json ! -path '*/__MACOSX/*' | head -n1)"
          DB_ROOT="$(dirname "$TRAIN_JSON")/database"
          test -f "$DEV_JSON" && test -d "$DB_ROOT"
          echo "DEV_JSON=$DEV_JSON" >> "$GITHUB_ENV"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43685240570
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: qwen9b-spider-dev12-value-question-only-frozen
          path: input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43685240570
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: qwen9b-spider-dev12-physical-value-paired-final
          path: input
      - name: Replay failed SQL against REAL physical DB and original Spider references
        run: |
          set -euo pipefail
          python -m evaluation.audit_spider12_failures \
            --final input/spider-value12-final.json \
            --manifest input/spider-value12-frozen.json \
            --source "$DEV_JSON" --db-root "$DB_ROOT" \
            --output spider12-physical-failure-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spider12-physical-gold-reference-failure-audit
          path: spider12-physical-failure-audit.json
          if-no-files-found: error
          retention-days: 30
