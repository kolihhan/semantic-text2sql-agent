name: Original Qwen9B DEV500 52 Oracle Gap Source Diagnostic (NO MODEL)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  oracle-gap-original-source-replay:
    if: github.event.action == 'opened' && github.head_ref == 'research/bird500-oracle-gap-support-census-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        part: [0,1,2,3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Verify source-only replay and failure-census guards
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_k8_oracle_gap_census.py tests/test_bounded_shard7_probe.py tests/test_k8_prefix_frontier.py
      - name: Download first-two immutable original Qwen9B K8 candidate shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 44086713331
          github-token: ${{ github.token }}
          pattern: k8-bird-dev500-prospective-cache-and-offline-score-shard-*
          path: all-source-caches
          merge-multiple: true
      - name: Download remaining original Qwen9B K8 candidate shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 44093103960
          github-token: ${{ github.token }}
          pattern: k8-bird-dev500-prospective-cache-and-offline-score-shard-*
          path: all-source-caches
          merge-multiple: true
      - name: Download the complete original physically-scored DEV500 K8 prefix workers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 44222560767
          github-token: ${{ github.token }}
          pattern: frozen-bird-dev500-prefix-worker-*
          path: original-physical-workers
          merge-multiple: true
      - name: Fetch only original SHA-frozen BIRD DEV public source question data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bird
          curl -fsSL --retry 5 \
            'https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/3c11fb193e5439b338e23677fa0aae11e8b85db9/data/dev_20251106-00000-of-00001.json?download=true' \
            -o /tmp/bird/bird-dev-original.json
          echo 'ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb  /tmp/bird/bird-dev-original.json' | sha256sum -c -
      - name: Fetch original SHA-frozen physical SQLite BIRD DEV databases
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 \
            'https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip' \
            -o /tmp/bird/dev.zip
          echo 'cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630  /tmp/bird/dev.zip' | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          original=$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)
          test -n "$original"
          mkdir -p /tmp/bird/dbfiles
          unzip -q "$original" -d /tmp/bird/dbfiles
          root=$(find /tmp/bird/dbfiles -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)
          if [ -z "$root" ]; then root=/tmp/bird/dbfiles; fi
          test -d "$root"
          echo "DB_ROOT=$root" >> "$GITHUB_ENV"
      - name: Replay only the original 52 wrong-selector oracle-positive cases, no Qwen calls
        shell: bash
        env:
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          python -m evaluation.k8_oracle_gap_census score \
            --part "$PART" \
            --source /tmp/bird/bird-dev-original.json \
            --db-root "$DB_ROOT" \
            --worker-dir original-physical-workers \
            --cache-dir all-source-caches \
            --manifest manifests/bird-dev500-holdout300-20261116-v2.json \
            --out "oracle-gap-mechanism-part-$PART.json"
      - name: Save source-only partial diagnostic, not a new accuracy score
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: original-Qwen9B-DEV500-oracle-gap-mechanism-part-${{ matrix.part }}
          path: oracle-gap-mechanism-part-${{ matrix.part }}.json
          if-no-files-found: warn
          retention-days: 30

  strict-source-only-mechanism-aggregate:
    needs: oracle-gap-original-source-replay
    if: github.event.action == 'opened' && github.head_ref == 'research/bird500-oracle-gap-support-census-20261118' && needs.oracle-gap-original-source-replay.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Prepare source-only deterministic aggregator and tests
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_k8_oracle_gap_census.py
      - name: Fetch EXACT four original-source mechanism diagnostic parts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: original-Qwen9B-DEV500-oracle-gap-mechanism-part-*
          path: oracle-gap-parts
          merge-multiple: true
      - name: Aggregate correctly replayed minority-vote/tie support census (no new scores)
        run: |
          set -euo pipefail
          python -m evaluation.k8_oracle_gap_census aggregate \
            --inputs oracle-gap-parts/oracle-gap-mechanism-part-*.json \
            --out original-DEV500-oracle-gap-52-cases-source-diagnostic.json
          python - <<'PY'
          import json
          p=json.load(open('original-DEV500-oracle-gap-52-cases-source-diagnostic.json'))
          assert p['replayed_cases']==52 and p['new_original_Qwen_inference_calls']==0
          assert p['holdout300_unused']
          print('ORACLE_GAP_SUPPORT_DIAGNOSTIC',json.dumps(p,sort_keys=True),flush=True)
          if p['status']!='COMPLETE_REPRODUCED_52_CASE_ORACLE_GAP_CENSUS':
              raise RuntimeError('replay timing drift or invalid source: no mechanism inference')
          PY
      - name: Upload final aggregate-only histogram, never source text or gold SQL
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-Qwen9B-DEV500-52-oracle-gap-cases-mechanism-census
          path: original-DEV500-oracle-gap-52-cases-source-diagnostic.json
          if-no-files-found: warn
          retention-days: 30
