name: COMPARE BIRD TRAIN16 Guarded LangGraph adaptive and K4 strict EX costs (CPU only)
on:
  push:
    branches: [research/bird-langgraph-conditional-physical-v1-20261123]
    paths: [.github/workflows/bird-langgraph-fourway-cost.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install only CPU dependencies and run cost proof tests
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_bird_langgraph_compare16.py tests/test_bird_langgraph_adaptive_physical.py
      - name: Wait for the existing BIRD Qwen LangGraph run, never rerun inference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=""
          for n in $(seq 1 55); do
            status="$(gh api repos/kolihhan/semantic-text2sql-agent/actions/runs/45047859446 --jq '.status + " " + (.conclusion // "pending")')"
            echo "SEALED_BIRD_LANGGRAPH_SOURCE_STATUS $n $status"
            if [ "$status" = "completed success" ]; then break; fi
            if [[ "$status" == completed* ]]; then
              echo "Cannot score incomplete/failed original Qwen run"; exit 1
            fi
            sleep 15
          done
          test "$status" = "completed success"
          echo "BIRD_ORIGINAL_QWEN_RUN_FULLY_FINAL_AND_SEALED"
      - name: Download exact original BIRD TRAIN16 frozen identities
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 45039635210
          github-token: ${{ github.token }}
          name: original-Qwen9B-newTRAIN16-k4-frozen-question-source
          path: frozen
      - name: Download prior original Qwen K4 gold-blind generated SQL
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 45039635210
          github-token: ${{ github.token }}
          pattern: original-Qwen9B-k4-physical16-generated-sealed-*
          merge-multiple: true
          path: k4-generated
      - name: Download prior original Qwen K4 post-seal scored EX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 45039635210
          github-token: ${{ github.token }}
          pattern: original-Qwen9B-k4-physical16-physical-score-*
          merge-multiple: true
          path: k4-scored
      - name: Download actual original Qwen adaptive LangGraph pre-gold trace seal
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 45047859446
          github-token: ${{ github.token }}
          pattern: adaptive-BIRD-LangGraph16-candidates-*
          merge-multiple: true
          path: adaptive-generated
      - name: Download actual original Qwen adaptive LangGraph post-seal EX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 45047859446
          github-token: ${{ github.token }}
          pattern: adaptive-BIRD-LangGraph16-score-*
          merge-multiple: true
          path: adaptive-scored
      - name: Strict identical-source, 4 physical DB, BIRD-only EX and Qwen calls / latency
        run: |
          set -euo pipefail
          python -m experiments.bird_langgraph_compare16 \
            --source frozen/source16.jsonl --manifest frozen/freeze.json \
            --adaptive-generated adaptive-generated/generated-{0,1,2,3}.json \
            --adaptive-scored adaptive-scored/scored-{0,1,2,3}.json \
            --k4-generated k4-generated/generated-{0,1,2,3}.json \
            --k4-scored k4-scored/scored-{0,1,2,3}.json \
            --out BIRD-TRAIN16-four-way-StrictEX-actual-Qwen-cost.json
          python - <<'PY'
          import json
          d=json.load(open('BIRD-TRAIN16-four-way-StrictEX-actual-Qwen-cost.json'))
          assert d["status"] == "FOUR_WAY_BIRD_STRICT_EX_AND_COST_RECONCILED"
          assert d["sample"]["n"]==16 and d["sample"]["dbs"]==4
          assert d["prior_k4_is_not_legacy_Guarded"]
          assert d["new_DEV500_or_reserved_HOLDOUT300_used"] is False
          assert d["production_promotion_permitted"] is False
          assert d["no_extra_inference_in_cost_report"]
          print("FINAL_BIRD_TRAIN16_FOUR_WAY_SEALED_EX_COST",json.dumps(
                {k:v for k,v in d.items() if k!="pairs"},sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-BIRD-TRAIN16-Guarded-adaptive-K4-PhysicalK4-StrictEX-cost
          path: BIRD-TRAIN16-four-way-StrictEX-actual-Qwen-cost.json
          retention-days: 30
          if-no-files-found: error
