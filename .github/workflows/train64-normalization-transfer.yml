name: Qwen9B locked literal normalization transfer to BIRD TRAIN64 (no inference)

on:
  workflow_dispatch:
  push:
    branches:
      - research/physical-literal-binding-probe-20261122
    paths:
      - .github/workflows/train64-normalization-transfer.yml
      - scripts/transfer_normalization_birdtrain64.py

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: src:.

jobs:
  strip-all-original-gold-before-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify locked normalization tests and no-gold source-identity script
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_experimental_literal_normalization_replay.py
          python -m compileall -q scripts/transfer_normalization_birdtrain64.py
      - name: Restore original publisher 64 labelled physical DB-disjoint BIRD TRAIN source
        uses: actions/download-artifact@v4
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43888747753
          github-token: ${{ github.token }}
          name: qwen9b-birdtrain-db-disjoint-original-sql-sft-candidates
          path: /tmp/original-source
      - name: Restore original Qwen3.5-9B no-new-call validation predictions and EX metadata
        uses: actions/download-artifact@v4
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43892823922
          github-token: ${{ github.token }}
          name: original-qwen9b-birdtrain-val64-complete
          path: /tmp/original-model
      - name: Cryptographically check and split inputs from original EX/gold
        run: |
          python -u -m scripts.transfer_normalization_birdtrain64 prepare \
            --source /tmp/original-source/validation.jsonl \
            --baseline /tmp/original-model/original-qwen9b-validation64-summary.json \
            --unlabeled .transfer/unlabeled/qwen9b-original-val64-sql-only.json \
            --labels .transfer/sealed/original-publisher-reference-and-ex.json
      - name: Upload stripped, no-label 64 model SQLs
        uses: actions/upload-artifact@v4
        with:
          name: TRAIN64-UNLABELED-ORIGINAL-QWEN9B-SQL
          path: .transfer/unlabeled/qwen9b-original-val64-sql-only.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload original reference SQL and EX separately, inaccessible to detector
        uses: actions/upload-artifact@v4
        with:
          name: TRAIN64-SEALED-PUBLISHER-EX-AND-GOLD
          path: .transfer/sealed/original-publisher-reference-and-ex.json
          if-no-files-found: error
          retention-days: 30

  cross-db-physical-probe-without-gold:
    needs: strip-all-original-gold-before-probe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact baseline SQLite verification source
        run: python -m pip install -e ".[dev]"
      - name: Read only stripped original model SQL/questions (NO EX or publisher gold)
        uses: actions/download-artifact@v4
        with:
          name: TRAIN64-UNLABELED-ORIGINAL-QWEN9B-SQL
          path: .transfer/unlabeled
      - name: Transport LOCKED same-column trim+case physical witness rules to 4 new DBs
        run: |
          python -u -m scripts.transfer_normalization_birdtrain64 freeze \
            --unlabeled .transfer/unlabeled/qwen9b-original-val64-sql-only.json \
            --database-root /tmp/valid64-physical-db \
            --output .transfer/frozen/normalization-val64-proposals.json
      - name: Upload gold-blind original SQL normalization proposals BEFORE any scoring
        uses: actions/upload-artifact@v4
        with:
          name: TRAIN64-NO-GOLD-FROZEN-NORMALIZED-SQL
          path: .transfer/frozen/normalization-val64-proposals.json
          if-no-files-found: error
          retention-days: 30

  score-original-physical-db-after-freeze:
    needs: cross-db-physical-probe-without-gold
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed original read-only SET/BAG execution evaluator
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: TRAIN64-NO-GOLD-FROZEN-NORMALIZED-SQL
          path: .transfer/frozen
      - uses: actions/download-artifact@v4
        with:
          name: TRAIN64-UNLABELED-ORIGINAL-QWEN9B-SQL
          path: .transfer/unlabeled
      - name: Read original reference SQL and EX only AFTER candidate freeze
        uses: actions/download-artifact@v4
        with:
          name: TRAIN64-SEALED-PUBLISHER-EX-AND-GOLD
          path: .transfer/sealed
      - name: Execute only modified SQL against original 4 verified physical DBs
        run: |
          python -u -m scripts.transfer_normalization_birdtrain64 score \
            --frozen .transfer/frozen/normalization-val64-proposals.json \
            --unlabeled .transfer/unlabeled/qwen9b-original-val64-sql-only.json \
            --labels .transfer/sealed/original-publisher-reference-and-ex.json \
            --database-root /tmp/valid64-physical-db \
            --output .transfer/scored/val64-normalization-cross-db-ex.json
      - name: Upload actual rescues/regressions and cross-DB transfer gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TRAIN64-CROSS-DB-PHYSICAL-NORMALIZATION-EX-SCORE
          path: .transfer/scored/val64-normalization-cross-db-ex.json
          if-no-files-found: ignore
          retention-days: 30
