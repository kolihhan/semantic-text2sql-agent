name: PRO Qwen9B description relevance pruning vs original Guarded BIRD12 strict EX
on:
  workflow_dispatch:
  push:
    branches: [experiment/qwen9b-relevance-pruned-descriptions-20261116]
    paths:
      - .github/workflows/qwen9b-description-prune-paired-bird12.yml
      - evaluation/qwen9b_pruned_descriptions_bird12.py
      - evaluation/qwen9b_description_noise_gate.py
      - tests/test_qwen9b_pruned_descriptions_bird12.py
permissions:
  contents: read

jobs:
  preregister:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Test schema tokenizer and Qwen-only trial accounting
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_schema_tokenization.py tests/test_qwen9b_pruned_descriptions_bird12.py
      - name: Download pinned BIRD DEV questions and physical database bytes
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 'https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/3c11fb193e5439b338e23677fa0aae11e8b85db9/data/dev_20251106-00000-of-00001.json?download=true' -o dev.json
          echo 'ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb  dev.json' | sha256sum -c -
          curl -fsSL --retry 4 'https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip' -o dev.zip
          echo 'cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630  dev.zip' | sha256sum -c -
          mkdir -p bird/unpacked bird/databases
          unzip -q dev.zip -d bird/unpacked
          DB_ZIP=$(find bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)
          test -n "$DB_ZIP"
          unzip -q "$DB_ZIP" -d bird/databases
          DB_ROOT=$(find bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)
          if [ -z "$DB_ROOT" ]; then DB_ROOT=bird/databases; fi
          echo "DB_ROOT=$PWD/$DB_ROOT" >> "$GITHUB_ENV"
      - name: Recover verified gold-blind source coverage on original BIRD100 (99 changed, 11 physical DBs)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43828304672
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: original-qwen9b-bird100-description-prune-source-coverage
          path: coverage
      - name: Recover frozen full-physical Qwen9B BIRD12 identities for strict exclusion
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43806556361
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: qwen-full-schema-grounding-frozen16
          path: prior/full
      - name: Recover frozen Spider TRAIN fewshot Qwen9B BIRD12 identities for strict exclusion
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43815197079
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: qwen-spider-fewshot-grounding-frozen16
          path: prior/spider
      - name: Verify gold-blind 99 of 100 affected source coverage before physical model inference
        run: |
          python - <<'PY'
          import json
          x=json.load(open("coverage/qwen9b-desc-bird100-coverage.json"))
          assert x["original100_matched"]==100
          assert x["original100_affected"]==99
          assert x["affected_physical_dbs"]>=11
          assert x["all_physical_schema_facts_preserved"] is True
          assert x["gold_answer_accessed"] is False and x["model_calls"]==0
          assert x["prospective_inference_worthwhile"] is True
          print("BIRD100_NO_LABEL_DESCRIPTION_NOISE_COVERAGE_GATE_PASS",flush=True)
          PY
      - name: Preregister 12 unseen Qwen9B BIRD physical schema cases across >=6 databases; no gold accessed
        run: |
          python -m evaluation.qwen9b_pruned_descriptions_bird12 \
            --source dev.json --root "$DB_ROOT" \
            --full-schema-prior prior/full/qwen-full-schema-cohort.json \
            --spider-prior prior/spider/qwen-spider-fewshot-cohort.json \
            --output qwen-description-prune-cohort.json
          python - <<'PY'
          import json
          x=json.load(open("qwen-description-prune-cohort.json"))
          assert x["count"]==12 and x["affected_dbs"]>=6
          assert x["previous_public_dev_exposures_excluded"]==124
          assert x["no_gold_used_for_selection"] and x["no_model_calls_at_freeze"]
          assert x["no_SQL_training"] and x["same_original_Qwen9B"]
          assert len(set(z["case_id"] for z in x["cases"]))==12
          assert all(z["original_context_chars"]>z["pruned_context_chars"] for z in x["cases"])
          print("GOLD_BLIND_BIRD12_PREREGISTRATION_SHA",x["cohort_sha256"],flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-description-prune-grounding-frozen16
          path: qwen-description-prune-cohort.json
          if-no-files-found: error
          retention-days: 30

  paired:
    needs: preregister
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qwen-description-prune-grounding-frozen16
      - name: Verify pinned BIRD source and database payload
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 'https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/3c11fb193e5439b338e23677fa0aae11e8b85db9/data/dev_20251106-00000-of-00001.json?download=true' -o dev.json
          echo 'ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb  dev.json' | sha256sum -c -
          curl -fsSL --retry 4 'https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip' -o dev.zip
          echo 'cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630  dev.zip' | sha256sum -c -
          mkdir -p bird/unpacked bird/databases
          unzip -q dev.zip -d bird/unpacked
          DB_ZIP=$(find bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)
          test -n "$DB_ZIP"
          unzip -q "$DB_ZIP" -d bird/databases
          DB_ROOT=$(find bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)
          if [ -z "$DB_ROOT" ]; then DB_ROOT=bird/databases; fi
          echo "DB_ROOT=$PWD/$DB_ROOT" >> "$GITHUB_ENV"
      - name: Install same pinned Qwen3.5 9B, no competing generator
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          OLLAMA_MAX_LOADED_MODELS=1 ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 1
          done
          ollama pull qwen3.5:9b-q4_K_M
      - name: Generate original Qwen9B Guarded vs question-pruned descriptions BEFORE gold EX
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python -m evaluation.qwen9b_pruned_descriptions_bird12 --source dev.json \
            --root "$DB_ROOT" --manifest qwen-description-prune-cohort.json \
            --shard "$SHARD" --output "qwen-description-prune-shard-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-description-prune-grounding-shard-${{ matrix.shard }}
          path: qwen-description-prune-shard-*.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: paired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qwen-description-prune-grounding-shard-*
          path: shards
          merge-multiple: true
      - run: |
          python -m evaluation.qwen9b_pruned_descriptions_bird12 \
            --inputs shards/qwen-description-prune-shard-*.json \
            --output qwen-description-prune-grounding-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-description-prune-grounding-measured
          path: qwen-description-prune-grounding-final.json
          if-no-files-found: error
          retention-days: 30
