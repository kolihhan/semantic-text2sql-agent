name: Original Qwen9B guarded semantic EX - literal grounding paired BIRD40
on:
  workflow_dispatch:
  push:
    branches: [fix/value-grounded-semantic-filter-20261113]
    paths:
      - .github/SQL_LITERAL_BIRD_START
permissions:
  contents: read
  actions: read

env:
  MODEL: qwen3.5:9b-q4_K_M
  BIRD_SHA: cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630

jobs:
  preregister:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_literal_evidence.py tests/test_literal_grounding_paired.py
      - name: Fetch previously exposed BIRD DEV question identities
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 43211214560
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: xiyan-semantic-independent100
          path: /tmp/previous/semantic
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 43243969734
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: semantic-abc-paired100
          path: /tmp/previous/abc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 43372535238
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: bird-bridge-paired100
          path: /tmp/previous/bridge
      - name: Fetch checksum-pinned BIRD DEV and SQLite
        run: |
          set -euo pipefail
          mkdir -p /tmp/bird
          curl -fL --retry 4 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "$BIRD_SHA  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          DEV_JSON="$(find /tmp/bird/unpacked -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)"
          DB_ZIP="$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)"
          test -s "$DEV_JSON" && test -s "$DB_ZIP"
          mkdir -p /tmp/bird/databases
          unzip -q "$DB_ZIP" -d /tmp/bird/databases
          DB_ROOT="$(find /tmp/bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)"
          if [ -z "$DB_ROOT" ]; then DB_ROOT=/tmp/bird/databases; fi
          test -d "$DB_ROOT"
          echo "DEV_JSON=$DEV_JSON" >> "$GITHUB_ENV"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
      - name: Select fresh 40 with verified literal evidence WITHOUT gold
        run: |
          set -euo pipefail
          python -m evaluation.literal_grounding_paired \
            --source "$DEV_JSON" \
            --database-root "$DB_ROOT" \
            --excluded runs/bird-paired-dev-v4/paired.json \
              /tmp/previous/semantic/xiyan-semantic-independent100.json \
              /tmp/previous/abc/semantic-abc-paired100.json \
              /tmp/previous/bridge/bird-bridge-paired100.json \
            --output literal-fresh40.json
          python - <<'PY'
          import json
          x=json.load(open('literal-fresh40.json'))
          assert x['excluded_count']==400
          assert x['labels_used'] is False
          assert len(x['selected'])==40
          print('PRE_REGISTERED_NEW_LITERAL40',len(x['selected']))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: literal-fresh40
          path: literal-fresh40.json
          retention-days: 30

  treatment:
    needs: preregister
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: literal-fresh40
          path: /tmp/frozen
      - name: Download fixed BIRD database source
        run: |
          set -euo pipefail
          mkdir -p /tmp/bird
          curl -fL --retry 4 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "$BIRD_SHA  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          DEV_JSON="$(find /tmp/bird/unpacked -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)"
          DB_ZIP="$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)"
          mkdir -p /tmp/bird/databases
          unzip -q "$DB_ZIP" -d /tmp/bird/databases
          DB_ROOT="$(find /tmp/bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)"
          if [ -z "$DB_ROOT" ]; then DB_ROOT=/tmp/bird/databases; fi
          test -s "$DEV_JSON" && test -d "$DB_ROOT"
          echo "DEV_JSON=$DEV_JSON" >> "$GITHUB_ENV"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
      - name: Start CPU Ollama Qwen 9B
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull "$MODEL"
      - name: Run paired original guarded vs value-grounded semantic SQL
        run: |
          python -m evaluation.literal_grounding_paired \
            --source "$DEV_JSON" \
            --database-root "$DB_ROOT" \
            --manifest /tmp/frozen/literal-fresh40.json \
            --shard-index "${{ matrix.shard }}" \
            --model "$MODEL" \
            --output "literal-paired-shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: literal-paired-shard-${{ matrix.shard }}
          path: literal-paired-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: treatment
    if: ${{ always() && needs.treatment.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: literal-paired-shard-*
          merge-multiple: true
          path: shards
      - name: Summarize original-model paired semantic EX
        run: |
          python -m evaluation.literal_grounding_paired \
            --inputs shards/literal-paired-shard-0.json shards/literal-paired-shard-1.json shards/literal-paired-shard-2.json shards/literal-paired-shard-3.json \
            --output qwen9b-literal-paired40.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qwen9b-literal-paired40
          path: qwen9b-literal-paired40.json
          if-no-files-found: error
          retention-days: 30
