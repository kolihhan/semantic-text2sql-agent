name: BIRD independent FK-bridge SQL candidate complementarity (4 CPU shards)

on:
  workflow_dispatch:
  push:
    branches: [experiment/bird-question-grounded-bridge-20261113]
    paths:
      - .github/BIRD_BRIDGE_GEN_START

permissions:
  contents: read
  actions: read

env:
  MODEL: hf.co/wanhin/XiYanSQL-QwenCoder-7B-2504-gguf:Q4_K_M

jobs:
  treatment:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout frozen FK-bridge ablation source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SQL project and SQLGlot
        run: python -m pip install -e ".[dev]"
      - name: Test bridge selection, question-grounding isolation and paired oracle contracts
        run: python -m pytest -q tests/test_bird_fk_bridge_generation.py
      - name: Install CPU Ollama and pinned XiYan model
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull "$MODEL"
      - name: Fetch checksum-pinned BIRD DEV and SQLite databases
        run: |
          set -euo pipefail
          mkdir -p /tmp/bird
          curl -fL --retry 4 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          DEV_JSON="$(find /tmp/bird/unpacked -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)"
          DB_ZIP="$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)"
          test -f "$DEV_JSON" && test -f "$DB_ZIP"
          mkdir -p /tmp/bird/databases
          unzip -q "$DB_ZIP" -d /tmp/bird/databases
          DB_ROOT="$(find /tmp/bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)"
          if [ -z "$DB_ROOT" ]; then DB_ROOT=/tmp/bird/databases; fi
          test -d "$DB_ROOT"
          echo "DEV_JSON=$DEV_JSON" >> "$GITHUB_ENV"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
      - name: Generate A0 and independent FK-bridged A1 SQL before gold scoring
        shell: bash
        run: |
          set -euo pipefail
          python -m experiments.bird_fk_bridge_generation \
            --source "$DEV_JSON" \
            --database-root "$DB_ROOT" \
            --frozen runs/bird-paired-dev-v4/paired.json \
            --model "$MODEL" \
            --shard-index "${{ matrix.shard }}" \
            --output "bridge-shard-${{ matrix.shard }}.json"
      - name: Upload frozen per-shard paired results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantic-bridge-shard-${{ matrix.shard }}
          path: bridge-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: treatment
    if: ${{ always() && needs.treatment.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: semantic-bridge-shard-*
          path: shards
          merge-multiple: true
      - name: Aggregate paired BIRD100 generation and oracle headroom
        run: |
          set -euo pipefail
          python -m experiments.bird_fk_bridge_generation \
            --inputs shards/bridge-shard-0.json shards/bridge-shard-1.json shards/bridge-shard-2.json shards/bridge-shard-3.json \
            --output bird-bridge-paired100.json
          python - <<'PY'
          import json
          p=json.load(open('bird-bridge-paired100.json'))
          assert p['count']==100
          assert p['promote'] is False
          assert len({c['case_id'] for c in p['cases']}) == 100
          print('BIRD_BRIDGE_FINAL', json.dumps({k:v for k,v in p.items() if k!='cases'},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bird-bridge-paired100
          path: bird-bridge-paired100.json
          if-no-files-found: error
          retention-days: 30
