name: BIRD100 frozen candidate semantic contract gate (training-free CPU)

on:
  workflow_dispatch:
  push:
    branches: [experiment/bird-structural-contract-veto-20261113]
    paths: [.github/BIRD_CONTRACT_GATE_START]

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install SQL project and run selector regression tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_bird_structural_contract_gate.py tests/test_bird_fk_bridge_generation.py
      - name: Download immutable prior independent XiYan BIRD100 paired artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 43372535238
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: bird-bridge-paired100
          path: /tmp/frozen-paired
      - name: Download original questions from checksum-pinned public BIRD DEV
        run: |
          set -euo pipefail
          mkdir -p /tmp/bird
          curl -fL --retry 4 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip '*/dev.json' -d /tmp/bird/unpacked || unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          DEV_JSON="$(find /tmp/bird/unpacked -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)"
          test -s "$DEV_JSON"
          echo "DEV_JSON=$DEV_JSON" >> "$GITHUB_ENV"
      - name: Test preregistered structural contract against frozen candidates
        run: |
          set -euo pipefail
          python -m experiments.bird_structural_contract_gate \
            --paired /tmp/frozen-paired/bird-bridge-paired100.json \
            --source "$DEV_JSON" \
            --output bird-structural-contract-gate100.json
          python - <<'PY'
          import json
          report=json.load(open("bird-structural-contract-gate100.json"))
          assert report["count"]==100
          assert report["baseline_correct"]==64
          assert report["challenger_correct"]==59
          assert report["no_learning_or_gold_in_selection"] is True
          assert report["promote"] is False
          print("SEMANTIC_CONTRACT_FINAL",json.dumps({
              k:v for k,v in report.items() if k!="decisions"},sort_keys=True))
          PY
      - name: Preserve complete audit without trained model or new SQL generation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantic-contract-gate100-frozen
          path: bird-structural-contract-gate100.json
          retention-days: 30
          if-no-files-found: error
