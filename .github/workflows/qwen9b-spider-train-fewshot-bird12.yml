name: PRO Qwen9B Spider TRAIN retrieved structure vs original Guarded BIRD12 strict EX
on:
  workflow_dispatch:
  push:
    branches: [experiment/qwen9b-spider-train-fewshot-bird12-20261116]
    paths:
      - .github/workflows/qwen9b-spider-train-fewshot-bird12.yml
      - evaluation/qwen9b_spider_fewshot_bird12.py
      - evaluation/fetch_spider_train_parquet.py
      - tests/test_qwen9b_spider_fewshot_bird12.py
permissions:
  contents: read

jobs:
  preregister:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Test schema tokenizer and Qwen-only trial accounting
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_schema_tokenization.py tests/test_qwen9b_spider_fewshot_bird12.py
      - name: Download pinned BIRD DEV questions and physical database bytes
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 'https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/3c11fb193e5439b338e23677fa0aae11e8b85db9/data/dev_20251106-00000-of-00001.json?download=true' -o dev.json
          echo 'ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb  dev.json' | sha256sum -c -
          curl -fsSL --retry 4 'https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip' -o dev.zip
          echo 'cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630  dev.zip' | sha256sum -c -
          mkdir -p bird/unpacked bird/databases
          unzip -q dev.zip -d bird/unpacked
          DB_ZIP=$(find bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)
          test -n "$DB_ZIP"
          unzip -q "$DB_ZIP" -d bird/databases
          DB_ROOT=$(find bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)
          if [ -z "$DB_ROOT" ]; then DB_ROOT=bird/databases; fi
          echo "DB_ROOT=$PWD/$DB_ROOT" >> "$GITHUB_ENV"
      - name: Exclude every prior Qwen9B original BIRD100 and newest physically exposed BIRD12 identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43806556361
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: qwen-full-schema-grounding-frozen16
          path: excluded
      - name: Pin authentic publisher Spider TRAIN SQL examples (only TRAIN)
        run: |
          python -m pip install -q 'pandas>=2.2,<4' 'pyarrow>=17,<24'
          python -m evaluation.fetch_spider_train_parquet \
            --output spider-train.parquet --report spider-train-source.json
      - name: Preregister 12 source-diverse BIRD questions and immutable external TRAIN examples, gold blind
        run: |
          python -m evaluation.qwen9b_spider_fewshot_bird12 \
            --source dev.json --root "$DB_ROOT" \
            --previous-cohort excluded/qwen-full-schema-cohort.json \
            --spider-parquet spider-train.parquet \
            --output qwen-spider-fewshot-cohort.json
          python - <<'PY'
          import json
          cfg=json.load(open('qwen-spider-fewshot-cohort.json'))
          assert cfg['count']==12 and cfg['physical_dbs']>=6
          assert cfg['BIRD_dev_previous_ids_excluded']==112
          assert cfg['gold_used_for_selection'] is False
          assert cfg['no_sql_training'] and cfg['same_original_qwen9b']
          assert all(len(x['examples'])==2 and
                     len({e['db_id'] for e in x['examples']})==2 and
                     all(e['source']=='Spider TRAIN' for e in x['examples'])
                     for x in cfg['cases'])
          print('SPIDER_SOURCE_ONLY_FROZEN_BIRD12',cfg['cohort_sha256'],flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-spider-fewshot-grounding-frozen16
          path: |
            qwen-spider-fewshot-cohort.json
            spider-train-source.json
          if-no-files-found: error
          retention-days: 30

  paired:
    needs: preregister
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qwen-spider-fewshot-grounding-frozen16
      - name: Verify pinned BIRD source and database payload
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 'https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/3c11fb193e5439b338e23677fa0aae11e8b85db9/data/dev_20251106-00000-of-00001.json?download=true' -o dev.json
          echo 'ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb  dev.json' | sha256sum -c -
          curl -fsSL --retry 4 'https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip' -o dev.zip
          echo 'cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630  dev.zip' | sha256sum -c -
          mkdir -p bird/unpacked bird/databases
          unzip -q dev.zip -d bird/unpacked
          DB_ZIP=$(find bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)
          test -n "$DB_ZIP"
          unzip -q "$DB_ZIP" -d bird/databases
          DB_ROOT=$(find bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)
          if [ -z "$DB_ROOT" ]; then DB_ROOT=bird/databases; fi
          echo "DB_ROOT=$PWD/$DB_ROOT" >> "$GITHUB_ENV"
      - name: Install same pinned Qwen3.5 9B, no competing generator
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          OLLAMA_MAX_LOADED_MODELS=1 ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 1
          done
          ollama pull qwen3.5:9b-q4_K_M
      - name: Generate Qwen9B original Guarded vs 2 Spider TRAIN structural examples before gold
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python -m evaluation.qwen9b_spider_fewshot_bird12 --source dev.json \
            --root "$DB_ROOT" --manifest qwen-spider-fewshot-cohort.json \
            --shard "$SHARD" --output "qwen-spider-fewshot-shard-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-spider-fewshot-grounding-shard-${{ matrix.shard }}
          path: qwen-spider-fewshot-shard-*.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: paired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qwen-spider-fewshot-grounding-shard-*
          path: shards
          merge-multiple: true
      - run: |
          python -m evaluation.qwen9b_spider_fewshot_bird12 \
            --inputs shards/qwen-spider-fewshot-shard-*.json \
            --output qwen-spider-fewshot-grounding-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-spider-fewshot-grounding-measured
          path: qwen-spider-fewshot-grounding-final.json
          if-no-files-found: error
          retention-days: 30
