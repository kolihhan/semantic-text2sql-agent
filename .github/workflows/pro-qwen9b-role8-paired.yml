name: PRO pinned Qwen3.5-9B role-scoped BIRD TRAIN8 matched strict EX

on:
  push:
    branches: [experiment/qwen9b-role-scoped-value-evidence-v1-20261117]
    paths:
      - experiments/qwen9b_role8_paired.py
      - tests/test_qwen9b_role8_paired.py
      - .github/workflows/pro-qwen9b-role8-paired.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-vs-value:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Test physical evidence scoping, scorer, frozen source and repeatable paired protocol
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_role_scoped_grounding.py tests/test_qwen9b_role8_paired.py
          python -m compileall -q experiments/qwen9b_role8_paired.py
      - name: Retrieve independently frozen source 16 from four unseen BIRD TRAIN databases
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 44012242171
          github-token: ${{ github.token }}
          name: qwen9b-third-newdb-role8-source-freeze
          path: source
      - name: Verify source freeze SHA and role-only candidates before model inference
        run: |
          set -euo pipefail
          echo "3be2fc49ba3cff4171e20afcaf70f1fc698c8be401ac332a29fa1f48b781168f  source/role-scoped8.jsonl" | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('source/freeze.json').read_text())
          assert j['status']=='FROZEN_BEFORE_ANY_MODEL_INFERENCE'
          assert j['questions']==8 and j['physical_databases']==4
          assert j['excluded_prior_train_source_databases']==32
          assert j['new_model_inference'] is False
          assert j['conditioned_on_role_scoped_physical_value_match'] is True
          assert j['physical_value_match_count'] >= 8
          print('BIRD_ROLE8_EXACT_SOURCE_SHA_VERIFIED_BEFORE_INFERENCE')
          PY
      - name: Start pinned Qwen3.5-9B Ollama CPU
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 2
          done
          ollama pull qwen3.5:9b-q4_K_M
      - name: Physically execute matched 2-case original versus role-scoped Qwen Guarded SQL
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python -m experiments.qwen9b_physical_value16_replica \
            --cohort source/role-scoped8.jsonl \
            --meta source/freeze.json --shard "$SHARD" \
            --db-work original-physical-sqlite \
            --out "role8-paired-shard-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen9b-role8-paired-shard-${{ matrix.shard }}
          path: role8-paired-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    if: always()
    needs: original-vs-value
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qwen9b-role8-paired-shard-*
          path: shards
          merge-multiple: true
      - name: Complete all 8 frozen cases or FAIL, no partial EX gains
        run: |
          set -euo pipefail
          python -m experiments.qwen9b_physical_value16_replica \
            --inputs shards/role8-paired-shard-*.json \
            --out role8-complete.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen9b-role8-complete-only
          path: role8-complete.json
          if-no-files-found: warn
          retention-days: 30
