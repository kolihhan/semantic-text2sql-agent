name: G2 BIRD TRAIN physical value evidence audit (CPU only)
on:
  push:
    branches: [research/birdtrain-g2-physical-evidence-20261123]
    paths:
      - .github/workflows/birdtrain-g2-physical-evidence.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  physical-value-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Setup project CPU-only requirements
        run: python -m pip install -e ".[dev]"
      - name: Download existing SHA-pinned 242+64 BIRD TRAIN source (all previously exposed physical DBs)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43888747753
          github-token: ${{ github.token }}
          name: qwen9b-birdtrain-db-disjoint-original-sql-sft-candidates
          path: historic
      - name: Audit new physical evidence without reading publisher SQL or dev scores
        run: |
          python -m experiments.birdtrain_g2_physical_evidence \
            --source historic --work /tmp/g2-exposed-dbs \
            --output g2-physical-evidence.json
      - name: Publish source-blind exact-match coverage and stop/go evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: birdtrain-g2-source-blind-physical-evidence
          path: g2-physical-evidence.json
          if-no-files-found: warn
          retention-days: 30
