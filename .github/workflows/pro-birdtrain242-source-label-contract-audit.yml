name: PRO BIRD TRAIN242 original SQL label contract audit (CPU)

on:
  push:
    branches: [research/birdtrain242-label-contract-audit-20261117]
    paths:
      - scripts/audit_birdtrain242_label_contracts.py
      - tests/test_audit_birdtrain242_label_contracts.py
      - .github/workflows/pro-birdtrain242-source-label-contract-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit-original-train-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_audit_birdtrain242_label_contracts.py
      - name: Reuse pinned original TRAIN-only compiled publisher SQL candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43888747753
          github-token: ${{ github.token }}
          name: qwen9b-birdtrain-db-disjoint-original-sql-sft-candidates
          path: original-source
      - name: Check question/reference semantic contract independent of model and DEV
        run: |
          set -euo pipefail
          python -m scripts.audit_birdtrain242_label_contracts \
            --train original-source/train.jsonl \
            --out evidence/original-birdtrain242-reference-contract-flags.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: birdtrain242-reference-contract-flags-source-only
          path: evidence/original-birdtrain242-reference-contract-flags.json
          if-no-files-found: error
          retention-days: 30
