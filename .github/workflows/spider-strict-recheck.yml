name: Frozen Spider100 A0 vs A4 strict read-only scoring audit

on:
  workflow_dispatch:
  push:
    branches: [experiment/sql-grounding-spider-shift-20261113]
    paths: [.github/SPIDER_STRICT_AUDIT_START]

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SPIDER_SHA256: 00636695dabed6b5f4b8328a16b13e069a2f16591d5efcce57660669c85b121b
    steps:
      - name: Checkout posthoc code (no model-generation or tuning)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify scorer's false positive and privacy guards
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_audit_spider_exec_strict.py tests/test_spider_grounding_shift.py tests/test_relational_grounding_v2.py
      - name: Download full frozen source A0/A4 predictions, never regenerate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 43259940204
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: spider-relational-grounding-paired100
          path: runs/frozen
      - name: Download identical checksum-verified Spider DEV SQLite set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/spider-dataset
          curl -fL --retry 4 --retry-delay 5 \
            https://huggingface.co/datasets/HAL-9001/spider-databases/resolve/main/spider_data.zip \
            -o /tmp/spider-dataset/spider_data.zip
          echo "$SPIDER_SHA256  /tmp/spider-dataset/spider_data.zip" | sha256sum -c -
          unzip -q /tmp/spider-dataset/spider_data.zip -d /tmp/spider-dataset/extract
          SPIDER_JSON="$(find /tmp/spider-dataset/extract -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)"
          test -n "$SPIDER_JSON"
          SPIDER_ROOT="$(dirname "$SPIDER_JSON")"
          DB_ROOT="$SPIDER_ROOT/database"
          test -d "$DB_ROOT"
          echo "SPIDER_JSON=$SPIDER_JSON" >> "$GITHUB_ENV"
          echo "SPIDER_DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
      - name: Re-score frozen 100 cases with bag/ordering and SQL AST metrics
        shell: bash
        run: |
          set -euo pipefail
          python -m experiments.audit_spider_exec_strict \
            --frozen runs/frozen/spider-a0-vs-a4-exec-paired100.json \
            --source "$SPIDER_JSON" \
            --database-root "$SPIDER_DB_ROOT" \
            --output runs/spider-strict-robustness100.json
          python - <<'PY'
          from pathlib import Path
          import json
          a=json.loads(Path("runs/spider-strict-robustness100.json").read_text())
          assert a["sample_size"]==100 and a["source_run_id"]==43259940204
          assert a["metrics"]["a0"]["set_correct"]==97 and a["metrics"]["a4"]["set_correct"]==96
          assert a["paired_transitions"]["set_equal"]=={
              "wrong_to_correct":0,"correct_to_wrong":1,"net":-1
          }
          print("STRICT_SP100_VERIFIED",json.dumps({
              k:v for k,v in a.items() if k!="cases"
          },sort_keys=True))
          PY
      - name: Preserve immutable score robustness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spider-frozen-bag-order-ast-recheck100
          path: runs/spider-strict-robustness100.json
          if-no-files-found: error
          retention-days: 30
