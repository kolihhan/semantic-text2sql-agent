name: PRO source-only SQLite value-to-column grounding feasibility (CPU)

on:
  push:
    branches: [experiment/qwen9b-entity-value-grounding-20261117]
    paths:
      - evaluation/physical_value_grounding.py
      - scripts/audit_birdtrain_value_grounding.py
      - tests/test_physical_value_grounding.py
      - .github/workflows/pro-birdtrain-physical-value-grounding.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-source-value-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Prove no-execution-label and injection-safe physical source lookup
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_physical_value_grounding.py
          python -m compileall -q scripts/audit_birdtrain_value_grounding.py
      - name: Recover frozen publisher source questions not reference labels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43888747753
          github-token: ${{ github.token }}
          name: qwen9b-birdtrain-db-disjoint-original-sql-sft-candidates
          path: inputs
      - name: Physical source-only value-candidate retrieval on four frozen BIRD TRAIN DBs
        run: |
          set -euo pipefail
          python -m scripts.audit_birdtrain_value_grounding \
            --validation inputs/validation.jsonl \
            --db-work original-publisher-sqlite \
            --out evidence/original-val64-value-lookup-feasibility.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen9b-original-birdtrain-value-grounding-source-feasibility
          path: evidence/original-val64-value-lookup-feasibility.json
          retention-days: 30
          if-no-files-found: error
