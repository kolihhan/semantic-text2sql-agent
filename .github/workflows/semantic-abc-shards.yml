name: XiYan Semantic Layer A0 A1 A2 A3 paired CPU shards

on:
  workflow_dispatch:
  push:
    branches: [experiment/semantic-layer-a1-a2-a3-20261112]
    paths:
      - .github/SEMANTIC_ABC_START

permissions:
  contents: read
  actions: read

env:
  MODEL: hf.co/wanhin/XiYanSQL-QwenCoder-7B-2504-gguf:Q4_K_M

jobs:
  treatment:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout frozen A0-A3 code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SQL project and SQLGlot
        run: python -m pip install -e ".[dev]"
      - name: Test A0-A3 mechanisms on independent synthetic databases
        run: python -m pytest -q tests/test_semantic_layer_abc.py
      - name: Download previous BIRD DEV cohort to exclude by ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: xiyan-semantic-independent100
          run-id: 43211214560
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          path: /tmp/previous-cohort
      - name: Extract ONLY explored IDs, discard prior SQL/scores before inference
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          previous = json.loads(Path('/tmp/previous-cohort/xiyan-semantic-independent100.json').read_text())
          ids = [str(row['case_id']) for row in previous['cases']]
          assert len(ids) == len(set(ids)) == 100
          Path('/tmp/previous-ids.json').write_text(json.dumps({'cases':[{'case_id':i} for i in ids]}))
          Path('/tmp/previous-cohort/xiyan-semantic-independent100.json').unlink()
          print('PREVIOUS_COHORT_IDS_ONLY', len(ids))
          PY
      - name: Install CPU Ollama and pinned XiYan model
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull "$MODEL"
      - name: Fetch checksum-pinned BIRD DEV and SQLite databases
        run: |
          set -euo pipefail
          mkdir -p /tmp/bird
          curl -fL --retry 4 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          DEV_JSON="$(find /tmp/bird/unpacked -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)"
          DB_ZIP="$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)"
          test -f "$DEV_JSON" && test -f "$DB_ZIP"
          mkdir -p /tmp/bird/databases
          unzip -q "$DB_ZIP" -d /tmp/bird/databases
          DB_ROOT="$(find /tmp/bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)"
          if [ -z "$DB_ROOT" ]; then DB_ROOT=/tmp/bird/databases; fi
          test -d "$DB_ROOT"
          echo "DEV_JSON=$DEV_JSON" >> "$GITHUB_ENV"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
      - name: Produce A0 A1 A2 A3 candidates before gold scoring
        shell: bash
        run: |
          set -euo pipefail
          python -m experiments.semantic_layer_abc \
            --source "$DEV_JSON" \
            --database-root "$DB_ROOT" \
            --frozen runs/bird-paired-dev-v4/paired.json \
            --previous /tmp/previous-ids.json \
            --model "$MODEL" \
            --shard-index "${{ matrix.shard }}" \
            --output "abc-shard-${{ matrix.shard }}.json"
      - name: Upload frozen per-shard paired results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantic-abc-shard-${{ matrix.shard }}
          path: abc-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: treatment
    if: ${{ always() && needs.treatment.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: semantic-abc-shard-*
          path: shards
          merge-multiple: true
      - name: Merge and verify paired A0 A1 A2 A3 against same 100 questions
        run: |
          set -euo pipefail
          python -m experiments.semantic_layer_abc \
            --inputs shards/abc-shard-0.json shards/abc-shard-1.json shards/abc-shard-2.json shards/abc-shard-3.json \
            --output semantic-abc-paired100.json
          python - <<'PY'
          import json
          p=json.load(open('semantic-abc-paired100.json'))
          assert p['sample_size']==100
          assert p['passive_a1_invariant'] is True
          assert len({c['case_id'] for c in p['cases']}) == 100
          print('ABC_PAIRED_FINAL', json.dumps({k:v for k,v in p.items() if k!='cases'},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantic-abc-paired100
          path: semantic-abc-paired100.json
          if-no-files-found: error
          retention-days: 30
