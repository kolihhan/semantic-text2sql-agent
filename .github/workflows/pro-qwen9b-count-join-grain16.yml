name: PRO no-train Qwen9B COUNT JOIN entity grain strict EX (16 new TRAIN)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: CPU proof: joined row count vs distinct parent entities and strict fail-closed source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_grain_guard.py tests/test_qwen9b_count_join_grain16.py
          python -m compileall -q src/semantic_sql/grain_guard.py experiments/qwen9b_count_join_grain16.py
      - name: Load SHA-checked full BIRD TRAIN and DEV IDs for exclusion only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 https://huggingface.co/datasets/Emulated-Inc/text-to-sql-with-evidence-training-pool/resolve/cd2c4ea321075aa53ce7dfe52deaaffa505d046a/raw/bird/train.json -o train.json
          echo "cd5884489dffd7c76d73509b396bd919fbe8b486efbc4ba2f48f89460de7d69f  train.json" | sha256sum -c -
          curl -fsSL --retry 5 "https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/3c11fb193e5439b338e23677fa0aae11e8b85db9/data/dev_20251106-00000-of-00001.json?download=true" -o dev.json
          echo "ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb  dev.json" | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43888747753
          github-token: ${{ github.token }}
          name: qwen9b-birdtrain-db-disjoint-original-sql-sft-candidates
          path: prior
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43904889296
          github-token: ${{ github.token }}
          name: qwen9b-fk-correction-prospective-source32-frozen
          path: prior-fk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43920461939
          github-token: ${{ github.token }}
          name: qwen9b-newdb-physical-value16-source-freeze
          path: prior-value
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43926576493
          github-token: ${{ github.token }}
          name: qwen9b-second-newdb-physical-value16-source-freeze
          path: prior-replica
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 44012242171
          github-token: ${{ github.token }}
          name: qwen9b-third-newdb-role8-source-freeze
          path: prior-role
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 44040520571
          github-token: ${{ github.token }}
          name: qwen9b-semantic-preview8-36db-excluded-frozen
          path: prior-preview
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 44042440721
          github-token: ${{ github.token }}
          name: qwen9b-column-type8-40db-excluded-frozen
          path: prior-column
      - name: Freeze four never-tested physical TRAIN databases, 16 source questions independent of model predictions
        shell: bash
        run: |
          set -euo pipefail
          python -m experiments.qwen9b_count_join_grain16 --source-only \
            --train train.json --dev dev.json \
            --prior-train prior/train.jsonl \
            --prior-validation prior/validation.jsonl \
            --prior-fk32 prior-fk/prospective32.jsonl \
            --prior-value16 prior-value/physical-value16.jsonl \
            --prior-value16-replica prior-replica/physical-value16.jsonl \
            --prior-role8 prior-role/role-scoped8.jsonl \
            --prior-preview8 prior-preview/semantic-preview8.jsonl \
            --prior-column8 prior-column/column-type8.jsonl \
            --work grain-source-sqlite --out frozen
          python - <<'PY'
          import json
          from pathlib import Path
          from hashlib import sha256
          m=json.loads(Path('frozen/freeze.json').read_text())
          rows=[json.loads(s) for s in Path('frozen/grain16.jsonl').read_text().splitlines()]
          assert m['status']=='FROZEN_NO_MODEL_INFERENCE'
          assert m['n']==16 and len(m['source_databases'])==4
          assert len(rows)==16 and len(set(r['source_index'] for r in rows))==16
          assert m['excluded_prior_train_db_count']==44
          assert m['source_sha256']==sha256(Path('frozen/grain16.jsonl').read_bytes()).hexdigest()
          assert m['question_selection_only_asks_how_many'] and m['no_qlora']
          print('FROZEN_GRAIN16_UNSEEN_DB_SOURCE',m['source_sha256'],m['source_databases'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen9b-count-join-grain16-frozen-only
          path: frozen/
          if-no-files-found: error
          retention-days: 30
  infer:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: '8192'
      OLLAMA_NUM_PARALLEL: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qwen9b-count-join-grain16-frozen-only
          path: frozen
      - name: Start original SHA-pinned Qwen3.5-9B Ollama CPU (no teacher or new training)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3.5:9b-q4_K_M
      - name: Physical Qwen baseline and zero-model-call count-by-entity repair strict paired set/bag EX
        shell: bash
        env:
          SHARD: "${{ matrix.shard }}"
        run: |
          set -euo pipefail
          python -m experiments.qwen9b_count_join_grain16 \
            --cohort frozen/grain16.jsonl --meta frozen/freeze.json \
            --shard "$SHARD" --work physical-sqlite \
            --out "grain16-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: "qwen9b-count-join-grain16-physical-shard-${{ matrix.shard }}"
          path: grain16-*.json
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    if: always()
    needs: infer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qwen9b-count-join-grain16-physical-shard-*
          path: shards
          merge-multiple: true
      - name: Fail closed unless exactly 16 original-source Qwen9B paired outputs
        shell: bash
        run: |
          set -euo pipefail
          python -m experiments.qwen9b_count_join_grain16 \
            --inputs shards/grain16-*.json --out grain16-complete.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen9b-count-join-grain16-complete-only
          path: grain16-complete.json
          if-no-files-found: warn
          retention-days: 30
