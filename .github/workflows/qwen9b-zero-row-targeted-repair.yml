name: Qwen9B zero-row targeted repair paired EX (research only)
on:
  workflow_dispatch:
  push:
    branches: [research/qwen9b-zero-row-targeted-repair-20261122]
    paths: [.github/workflows/qwen9b-zero-row-targeted-repair.yml]
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: src:.
  DB_ZIP_SHA256: cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630
  SOURCE_HF_COMMIT: 3c11fb193e5439b338e23677fa0aae11e8b85db9
  SOURCE_RAW_SHA256: ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb
  SOURCE_HIST_SHA256: 0310b7ca2dfb6247234e2073f93e7a75106ee41ba55231f75d06d2ef68efe2ec
  MODEL: qwen3.5:9b-q4_K_M

jobs:
  infer-gold-blind:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unchanged verifier and test research safety controls
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_qwen9b_empty_result_targeted_repair.py
          python -m compileall -q scripts/qwen9b_empty_result_targeted_repair.py
      - name: Fetch frozen original Qwen9B selected SQL WITHOUT labels
        uses: actions/download-artifact@v4
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 44930911891
          github-token: ${{ github.token }}
          name: blind-candidates-before-scoring
          path: .frozen/unlabeled
      - name: Download physically verified BIRD DEV SQLite (no publisher labels)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bird/databases
          curl -fLsS --retry 3 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "$DB_ZIP_SHA256  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          nested="$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n 1)"
          test -n "$nested"
          unzip -q "$nested" -d /tmp/bird/databases
          root="$(find /tmp/bird/databases -type d -name dev_databases | head -n1)"
          if [ -z "$root" ]; then root=/tmp/bird/databases; fi
          echo "DB_ROOT=$root" >> "$GITHUB_ENV"
          rm -rf /tmp/bird/dev.zip /tmp/bird/unpacked
      - name: Pull exact original Qwen9B model on CPU
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          ollama pull "$MODEL"
      - name: Run bounded one-Qwen-call zero-row repairs, BEFORE accessing gold
        shell: bash
        run: |
          set -euo pipefail
          python -u -m scripts.qwen9b_empty_result_targeted_repair infer \
            --unlabeled .frozen/unlabeled/candidates.json \
            --database-root "$DB_ROOT" \
            --output .frozen/candidates/repaired.json
      - name: Upload all candidate decisions SEALED before scoring
        uses: actions/upload-artifact@v4
        with:
          name: zero-row-qwen9b-no-gold-candidates
          path: .frozen/candidates/repaired.json
          if-no-files-found: error
          retention-days: 30

  score-after-seal:
    needs: infer-gold-blind
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen SQLite readonly scorer
        run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: zero-row-qwen9b-no-gold-candidates
          path: .frozen/candidates
      - uses: actions/download-artifact@v4
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 44930911891
          github-token: ${{ github.token }}
          name: blind-candidates-before-scoring
          path: .frozen/unlabeled
      - name: Obtain sealed original EX labels ONLY in scorer
        uses: actions/download-artifact@v4
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 44930911891
          github-token: ${{ github.token }}
          name: original-labels-isolated-from-detector
          path: .frozen/labels
      - name: Retrieve exact SHA-pinned BIRD database and publisher references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bird/databases .frozen/publisher
          curl -fLsS --retry 3 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "$DB_ZIP_SHA256  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          nested="$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)"
          test -n "$nested"
          unzip -q "$nested" -d /tmp/bird/databases
          root="$(find /tmp/bird/databases -type d -name dev_databases | head -n1)"
          if [ -z "$root" ]; then root=/tmp/bird/databases; fi
          echo "DB_ROOT=$root" >> "$GITHUB_ENV"
          curl -fLsS --retry 3 "https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/$SOURCE_HF_COMMIT/data/dev_20251106-00000-of-00001.json?download=true" \
            -o .frozen/publisher/source-lf.json
          echo "$SOURCE_RAW_SHA256  .frozen/publisher/source-lf.json" | sha256sum -c -
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          raw=Path('.frozen/publisher/source-lf.json').read_bytes()
          assert b'\r\n' not in raw
          historical=raw.replace(b'\n',b'\r\n')
          Path('.frozen/publisher/source-historical.json').write_bytes(historical)
          assert hashlib.sha256(historical).hexdigest()==os.environ['SOURCE_HIST_SHA256']
          PY
      - name: Paired strict SET/BAG replay including all original right controls
        run: |
          python -u -m scripts.qwen9b_empty_result_targeted_repair score \
            --inferred .frozen/candidates/repaired.json \
            --unlabeled .frozen/unlabeled/candidates.json \
            --labels .frozen/labels/labels.json \
            --publisher .frozen/publisher/source-historical.json \
            --database-root "$DB_ROOT" \
            --output .frozen/final/paired-strict-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero-row-qwen9b-paired-set-bag-scores
          path: .frozen/final/paired-strict-report.json
          if-no-files-found: warn
          retention-days: 30
