name: BIRD32 genuine paired EX / token-cost scorecard CPU replay (zero Qwen)
on:
  push:
    branches: [research/bird-semantic-evidence-budget-v1-20261123]
    paths: [.github/workflows/bird32-paired-scorecard-cpu.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paired-scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11'}
      - name: Verify real Ollama telemetry and paired McNemar tests (no model)
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_ollama_usage_telemetry.py tests/test_paired_scorecard.py
      - name: Download 4 sealed genuine original BIRD32 scorer shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 45103219648
          github-token: ${{ github.token }}
          pattern: BIRD-GLOBAL-TRAIN32-STRICT-EX-SHARD-*
          merge-multiple: true
          path: original-scored
      - name: Reuse past BIRD32 real SQL execution outputs and report cost UNKNOWN correctly
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          from evaluation.paired_scorecard import paired_bird_scorecard
          shards=sorted(Path('original-scored').glob('scored-*.json'))
          assert len(shards)==4, [str(x) for x in shards]
          rows=[]
          for shard_no,shard in enumerate(shards):
              obj=json.loads(shard.read_text())
              assert obj['protocol']=='BIRD-QWEN9B-TRAIN32-GROUPED-GLOBAL-LANGGRAPH-PAIRED-V1'
              assert obj['phase']=='POST_SEAL_PUBLISHER_BIRD_STRICT_SCORE'
              assert obj['original_source_sha256']=='cd5884489dffd7c76d73509b396bd919fbe8b486efbc4ba2f48f89460de7d69f'
              assert obj['shard']==shard_no and obj['n']==8
              rows.extend(obj['cases'])
          s=paired_bird_scorecard(rows)
          assert s['questions_total']==32 and s['questions_scorable']==32
          assert s['distinct_database_families']==32
          assert s['strict_set_ex']['control_correct']==15
          assert s['strict_set_ex']['treatment_correct']==15
          assert s['strict_set_ex']['rescue_n']==0
          assert s['strict_set_ex']['regression_n']==0
          assert s['cost']['shared_Qwen_calls']==42
          assert s['changed_sql_n']==0
          assert s['cost']['prompt_tokens'] is None
          assert s['cost']['generated_tokens'] is None
          assert s['cost']['actual_USD_cost'] is None
          s.update({
            'source_run':45103219648,
            'fixed_model_digest':'56671c2ab9385f9cfcb404638e32cd62d88e3501d44822208363c010179a3c90',
            'evidence':'BIRD TRAIN32, 32 question-ID-frozen distinct but historically exposed physical DB families',
            'protected_HOLDOUT300_and_last_two_TRAIN_DBs':False,
            'promote_previous_mechanism':False,
            'no_new_Qwen_inference':True,
          })
          out=Path('BIRD32-paired-strict-EX-and-cost-report.json')
          out.write_text(json.dumps(s,indent=2,sort_keys=True)+'\n')
          print('FINAL_BIRD32_REAL_PAIRED_SCORECARD',json.dumps({
            k:v for k,v in s.items() if k!='per_database_net_set'
          },sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FINAL-BIRD32-REAL-PAIRED-STRICT-EX-AND-COST-CENSUS
          path: BIRD32-paired-strict-EX-and-cost-report.json
          retention-days: 30
          if-no-files-found: error
