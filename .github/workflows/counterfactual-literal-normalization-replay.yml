name: Counterfactual Qwen9B literal-normalization EX replay (historical DEV only)

on:
  workflow_dispatch:
  push:
    branches:
      - research/physical-literal-binding-probe-20261122
    paths:
      - .github/workflows/counterfactual-literal-normalization-replay.yml
      - scripts/experimental_literal_normalization_replay.py
      - tests/test_experimental_literal_normalization_replay.py

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: src:.
  DB_ZIP_SHA256: cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630
  SOURCE_HF_COMMIT: 3c11fb193e5439b338e23677fa0aae11e8b85db9
  SOURCE_RAW_SHA256: ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb
  SOURCE_HISTORICAL_SHA256: 0310b7ca2dfb6247234e2073f93e7a75106ee41ba55231f75d06d2ef68efe2ec

jobs:
  freeze-without-publisher-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run preregistered synthetic regression tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_experimental_literal_normalization_replay.py tests/test_blind_literal_binding_probe.py
          python -m compileall -q scripts/experimental_literal_normalization_replay.py
      - uses: actions/download-artifact@v4
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 44930911891
          github-token: ${{ github.token }}
          name: blind-candidates-before-scoring
          path: .frozen/candidates
      - uses: actions/download-artifact@v4
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 44930911891
          github-token: ${{ github.token }}
          name: label-blind-physical-observations
          path: .frozen/flags
      - name: Read-only SHA-pinned BIRD physical SQLite source
        run: |
          set -euo pipefail
          mkdir -p /tmp/bird /tmp/bird/databases
          curl -fL --retry 3 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "$DB_ZIP_SHA256  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          DB_ZIP="$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)"
          test -n "$DB_ZIP"
          unzip -q "$DB_ZIP" -d /tmp/bird/databases
          DB_ROOT="$(find /tmp/bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)"
          if [ -z "$DB_ROOT" ]; then DB_ROOT=/tmp/bird/databases; fi
          test -d "$DB_ROOT"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
          rm -rf /tmp/bird/dev.zip /tmp/bird/unpacked
      - name: Create SQL correction proposals with no access to gold/EX
        run: |
          python -u -m scripts.experimental_literal_normalization_replay freeze \
            --candidates .frozen/candidates/candidates.json \
            --signals .frozen/flags/signals.json \
            --database-root "$DB_ROOT" \
            --output .frozen/proposals/normalized-literal-sql-proposals.json
      - name: Upload sealed SQL proposal artifact before score
        uses: actions/upload-artifact@v4
        with:
          name: original-qwen9b-NO-GOLD-normalized-sql-candidates
          path: .frozen/proposals/normalized-literal-sql-proposals.json
          if-no-files-found: error
          retention-days: 30

  score-after-freeze:
    needs: freeze-without-publisher-gold
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unchanged BIRD exact-set EX execution harness
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: original-qwen9b-NO-GOLD-normalized-sql-candidates
          path: .frozen/proposals
      - uses: actions/download-artifact@v4
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 44930911891
          github-token: ${{ github.token }}
          name: blind-candidates-before-scoring
          path: .frozen/candidates
      - name: Download original labelled EX metadata only after SQL candidate freeze
        uses: actions/download-artifact@v4
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 44930911891
          github-token: ${{ github.token }}
          name: original-labels-isolated-from-detector
          path: .frozen/labels
      - name: Retrieve pinned physical database for independent readonly replay
        run: |
          set -euo pipefail
          mkdir -p /tmp/bird /tmp/bird/databases
          curl -fL --retry 3 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "$DB_ZIP_SHA256  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          DB_ZIP="$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)"
          test -n "$DB_ZIP"
          unzip -q "$DB_ZIP" -d /tmp/bird/databases
          DB_ROOT="$(find /tmp/bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)"
          if [ -z "$DB_ROOT" ]; then DB_ROOT=/tmp/bird/databases; fi
          test -d "$DB_ROOT"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
          rm -rf /tmp/bird/dev.zip /tmp/bird/unpacked
      - name: Retrieve pinned publisher BIRD DEV gold only in scoring job
        run: |
          set -euo pipefail
          mkdir -p .frozen/gold
          curl -fLsS --retry 3 "https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/$SOURCE_HF_COMMIT/data/dev_20251106-00000-of-00001.json?download=true" -o .frozen/gold/source-lf.json
          echo "$SOURCE_RAW_SHA256  .frozen/gold/source-lf.json" | sha256sum -c -
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          raw=Path(".frozen/gold/source-lf.json").read_bytes()
          assert b"\r\n" not in raw
          historical=raw.replace(b"\n",b"\r\n")
          Path(".frozen/gold/source-historical.json").write_bytes(historical)
          assert hashlib.sha256(historical).hexdigest()==os.environ["SOURCE_HISTORICAL_SHA256"]
          PY
      - name: Replay only frozen modified SQL; score exact-set/BAG vs same gold
        run: |
          python -u -m scripts.experimental_literal_normalization_replay score \
            --patches .frozen/proposals/normalized-literal-sql-proposals.json \
            --candidates .frozen/candidates/candidates.json \
            --labels .frozen/labels/labels.json \
            --source .frozen/gold/source-historical.json \
            --database-root "$DB_ROOT" \
            --output .frozen/scores/historical-normalization-ex-counterfactual.json
      - name: Archive honest rescue/regression and cost report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-normalization-ex-counterfactual-score
          path: .frozen/scores/historical-normalization-ex-counterfactual.json
          if-no-files-found: ignore
          retention-days: 30
