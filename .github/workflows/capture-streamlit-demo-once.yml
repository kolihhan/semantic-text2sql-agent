name: Capture real Streamlit demo screenshot once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-streamlit-demo-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout actual main-branch app
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app and screenshot browser
        run: |
          python -m pip install -e '.[dev]' playwright pillow
          python -m playwright install --with-deps chromium
      - name: Run real Streamlit app
        shell: bash
        run: |
          set -euo pipefail
          nohup streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 --browser.gatherUsageStats false --theme.base light > /tmp/semantic-streamlit.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null 2>&1; then
              echo STREAMLIT_HEALTHY
              exit 0
            fi
            sleep 1
          done
          cat /tmp/semantic-streamlit.log
          exit 1
      - name: Interact with demo and capture actual rendered output
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from playwright.sync_api import sync_playwright, expect
          output=Path("docs/assets/streamlit-demo.png")
          output.parent.mkdir(parents=True,exist_ok=True)
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--no-sandbox"])
              page=browser.new_page(viewport={"width":1440,"height":960},device_scale_factor=1)
              page.goto("http://127.0.0.1:8501",wait_until="domcontentloaded",timeout=60000)
              btn=page.get_by_role("button",name="Generate SQL")
              expect(btn).to_be_visible(timeout=60000)
              btn.click()
              expect(page.get_by_text("Pipeline activity")).to_be_visible(timeout=60000)
              expect(page.get_by_text("Generated SQL")).to_be_visible(timeout=60000)
              expect(page.get_by_text("PASS",exact=False)).to_be_visible(timeout=60000)
              body=page.locator("body").inner_text()
              assert "SUM(orders.total_amount)" in body,body[-3000:]
              assert "execute" in body.lower(),body[-3000:]
              page.wait_for_timeout(750)
              page.screenshot(path=str(output),full_page=True,animations="disabled")
              browser.close()
          with Image.open(output) as screenshot:
              print("LIVE_STREAMLIT_SCREENSHOT_VERIFIED",screenshot.size,output.stat().st_size)
              assert screenshot.width>=1280 and screenshot.height>=700
          PY
      - name: Add README preview and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path("README.md")
          text=p.read_text()
          anchor="The demo displays the generated SQL, validation steps, and returned rows. The same service powers the CLI, Streamlit UI, and FastAPI endpoint."
          assert anchor in text,"Demo insertion anchor missing"
          image='\n\n![Live Streamlit demo showing generated SQL, safety verification, and results](docs/assets/streamlit-demo.png)'
          assert "docs/assets/streamlit-demo.png" not in text
          p.write_text(text.replace(anchor,anchor+image))
          Path(".github/workflows/capture-streamlit-demo-once.yml").unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/assets/streamlit-demo.png .github/workflows/capture-streamlit-demo-once.yml
          git diff --cached --check
          git commit -m "Embed actual Streamlit demo screenshot in project README"
          git push origin HEAD:main
