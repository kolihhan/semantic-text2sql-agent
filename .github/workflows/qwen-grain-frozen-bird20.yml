name: Qwen9B exact frozen grain-first generation cross-source BIRD DEV20 strict EX
on:
  push:
    branches: [experiment/qwen-grain-frozen-bird20-transfer-20261115]
    paths: [.github/workflows/qwen-grain-frozen-bird20.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: No retuning; original Spider hint SHA, BIRD20 scoring and source tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_qwen_grain_direct_spider.py tests/test_qwen_grain_bird20_transfer.py
      - name: Retrieve original SHA-pinned BIRD DEV public source (not gold for selecting)
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 'https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/3c11fb193e5439b338e23677fa0aae11e8b85db9/data/dev_20251106-00000-of-00001.json?download=true' -o dev.json
          echo 'ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb  dev.json' | sha256sum -c -
      - name: Gold-blind freeze original 20 BIRD questions across 10 DBs, excluding historic100
        run: |
          python -m evaluation.qwen_grain_bird20_transfer \
            --source dev.json --original runs/bird-paired-dev-v5/paired.json \
            --output qwen-grain-original-bird20-frozen.json
          python - <<'PY'
          import json
          m=json.load(open('qwen-grain-original-bird20-frozen.json'))
          assert m['n']==20 and m['databases']==10
          assert m['spider_grain_hint_sha256']=='ec071e441fd02425cb286ad12c3fec2934b1fa43d64b2da4344c80381b617804'
          assert m['source_gold_used_during_freeze'] is False
          assert m['question_disjoint_original_BIRD100'] is True
          print('QWEN_GRAIN_TRANSFER_FROZEN_BEFORE_PREDICTIONS',m['selected_cohort_sha256'],flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frozen-qwen-grain-bird20-manifest
          path: qwen-grain-original-bird20-frozen.json
          if-no-files-found: error

  paired:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: '8192'
      OLLAMA_NUM_PARALLEL: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frozen-qwen-grain-bird20-manifest
      - name: Restore pinned source and physical SQLite DB files
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 'https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/3c11fb193e5439b338e23677fa0aae11e8b85db9/data/dev_20251106-00000-of-00001.json?download=true' -o dev.json
          echo 'ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb  dev.json' | sha256sum -c -
          curl -fsSL --retry 4 'https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip' -o dev.zip
          echo 'cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630  dev.zip' | sha256sum -c -
          mkdir -p bird/unpacked bird/databases
          unzip -q dev.zip -d bird/unpacked
          DB_ZIP=$(find bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)
          test -n "$DB_ZIP"
          unzip -q "$DB_ZIP" -d bird/databases
          DB_ROOT=$(find bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)
          if [ -z "$DB_ROOT" ]; then DB_ROOT=bird/databases; fi
          echo "DB_ROOT=$PWD/$DB_ROOT" >> "$GITHUB_ENV"
      - name: Install original unchanged Qwen3.5-9B on free CPU
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          ollama pull qwen3.5:9b-q4_K_M
      - name: Pair identical initial generator except original frozen Spider grain hint
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python -m evaluation.qwen_grain_bird20_transfer \
            --source dev.json \
            --original runs/bird-paired-dev-v5/paired.json \
            --frozen qwen-grain-original-bird20-frozen.json \
            --database-root "$DB_ROOT" --shard "$SHARD" \
            --output "qwen-grain-original-bird20-shard-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-grain-bird20-shard-${{ matrix.shard }}
          path: qwen-grain-original-bird20-shard-*.json
          if-no-files-found: warn

  aggregate:
    needs: paired
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qwen-grain-bird20-shard-*
          merge-multiple: true
          path: shards
      - name: Aggregate strict set and bag EX, rescues, regressions, cases
        run: |
          python -m evaluation.qwen_grain_bird20_transfer \
            --inputs shards/qwen-grain-original-bird20-shard-0.json \
                     shards/qwen-grain-original-bird20-shard-1.json \
                     shards/qwen-grain-original-bird20-shard-2.json \
                     shards/qwen-grain-original-bird20-shard-3.json \
            --output qwen-grain-original-bird20-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-grain-bird20-frozen-source-shift-final
          path: qwen-grain-original-bird20-final.json
          if-no-files-found: error
