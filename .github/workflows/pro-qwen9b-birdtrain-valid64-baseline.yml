name: PRO Qwen3.5-9B true database-heldout BIRD TRAIN validation64 baseline

on:
  push:
    branches: [experiment/qwen9b-birdtrain-db4-guarded-baseline64-20261116]
    paths:
      - experiments/qwen9b_birdtrain_valid64_baseline.py
      - tests/test_qwen9b_birdtrain_valid64_baseline.py
      - .github/workflows/pro-qwen9b-birdtrain-valid64-baseline.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qwen-original:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install unchanged Qwen9B original Guarded code and regression tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_qwen9b_birdtrain_valid64_baseline.py
      - name: Recover original frozen validation64 from prior source-verification run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43888747753
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: qwen9b-birdtrain-db-disjoint-original-sql-sft-candidates
          path: inputs
      - name: Attest original validation64 SHA and source-only database split
        run: |
          set -euo pipefail
          echo "cc112305bc9de33a03cea704f2edecfdfb45e62cc953ae498cea27fbed93b506  inputs/validation.jsonl" | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('inputs/source-verification.json').read_text())
          assert r['train_n']==242 and r['validation_n']==64
          assert r['train_db_n']==16 and r['validation_db_n']==4
          assert r['dev_db_overlap']==0 and r['train_valid_db_overlap']==0
          assert r['actual_model_training_steps']==0 and r['heldout_bird_dev_v2_accessed'] is False
          print("QWEN9B_VAL64_ORIGINAL_SOURCE_ATTESTED")
          PY
      - name: Start unchanged SHA-checked Qwen3.5-9B Ollama CPU
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 2
          done
          ollama pull qwen3.5:9b-q4_K_M
      - name: Physically score original Qwen direct and Guarded predictions on source-disjoint TRAIN DB
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python -m experiments.qwen9b_birdtrain_valid64_baseline \
            --validation inputs/validation.jsonl \
            --shard "$SHARD" \
            --work original-db \
            --output "original-qwen-val64-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-qwen9b-db-disjoint-val64-shard-${{ matrix.shard }}
          path: original-qwen-val64-${{ matrix.shard }}.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    if: always()
    needs: qwen-original
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: original-qwen9b-db-disjoint-val64-shard-*
          path: original-shards
          merge-multiple: true
      - name: Require 64 original paired-identifiable heldout source cases, no partial final
        run: |
          set -euo pipefail
          python -m experiments.qwen9b_birdtrain_valid64_baseline \
            --inputs original-shards/original-qwen-val64-*.json \
            --output original-qwen9b-validation64-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-qwen9b-birdtrain-val64-complete
          path: original-qwen9b-validation64-summary.json
          if-no-files-found: warn
          retention-days: 30
