name: Qwen9B publisher annotated FK metadata physical EX source-shift
on:
  push:
    branches: [experiment/spider-published-fk-source-20261115]
    paths: [.github/workflows/qwen-published-fk-spider-paired.yml, tests/test_spider_published_fk.py]
  workflow_dispatch:
permissions:
  contents: read
env:
  SPIDER_SHA256: 00636695dabed6b5f4b8328a16b13e069a2f16591d5efcce57660669c85b121b

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Gold-blind selection and nonregression unit tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_spider_published_fk.py
      - name: Restore source and preregister six physically untouched databases
        run: |
          set -euo pipefail
          mkdir -p /tmp/spider
          curl -fL --retry 4 --retry-delay 5 https://huggingface.co/datasets/HAL-9001/spider-databases/resolve/main/spider_data.zip -o /tmp/spider/source.zip
          echo "$SPIDER_SHA256  /tmp/spider/source.zip" | sha256sum -c -
          unzip -q /tmp/spider/source.zip -d /tmp/spider/extract
          TRAIN_JSON="$(find /tmp/spider/extract -type f -name train_spider.json ! -path '*/__MACOSX/*' | head -n1)"
          DEV_JSON="$(find /tmp/spider/extract -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)"
          DB_ROOT="$(dirname "$TRAIN_JSON")/database"
          TABLES_JSON="$(find /tmp/spider/extract -type f -name tables.json ! -path '*/__MACOSX/*' | head -n1)"
          test -n "$TABLES_JSON"
          export DB_ROOT TABLES_JSON
          python - <<'PY'
          import json,os
          from pathlib import Path
          from collections import Counter
          from evaluation.spider_published_fk import published_foreign_keys
          from semantic_sql.catalog import DatabaseCatalog
          root=Path(os.environ["DB_ROOT"])
          meta=json.load(open(os.environ["TABLES_JSON"]))
          out=Counter()
          examples=[]
          for e in meta:
              dbid=e["db_id"]
              db=root/dbid/(dbid+".sqlite")
              if not db.exists():
                  continue
              c=DatabaseCatalog.from_sqlite(db)
              fk=published_foreign_keys(c,e)
              declared={frozenset(((a,b),(d,f))) for a,b,d,f in c.foreign_keys}
              missing=[edge for edge in fk if frozenset(((edge[0],edge[1]),(edge[2],edge[3]))) not in declared]
              out["source_databases"]+=1
              out["source_annotations"]+=len(e.get("foreign_keys",[]))
              out["physically_valid_annotations"]+=len(fk)
              out["physical_pragma_fks"]+=len(c.foreign_keys)
              out["source_only_fk_edges"]+=len(missing)
              if missing and len(examples)<5:
                  examples.append((dbid,len(missing),len(c.foreign_keys)))
          print("PUBLISHED_SPIDER_FK_PHYSICAL_COVERAGE",dict(out),"missing_examples",examples,flush=True)
          PY
          python -m evaluation.qwen_published_fk_spider --train "$TRAIN_JSON" --dev "$DEV_JSON" --db-root "$DB_ROOT" --tables "$TABLES_JSON" --output spider-published-fk-frozen.json
          python - <<'PY'
          import json
          x=json.load(open("spider-published-fk-frozen.json"))
          assert x["count"]==12 and x["physical_dbs"]==6 and x["gold_blind"]
          assert all("query" not in c for c in x["cases"])
          print("FROZEN_DBS",sorted({c["db_id"] for c in x["cases"]}))
          print("COHORT_SHA",x["cases_sha256"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-published-fk-source-cohort-frozen
          path: spider-published-fk-frozen.json
          if-no-files-found: error

  paired:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 175
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: '8192'
      OLLAMA_NUM_PARALLEL: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qwen-published-fk-source-cohort-frozen
      - name: Restore identical source, SHA verification
        run: |
          set -euo pipefail
          mkdir -p /tmp/spider
          curl -fL --retry 4 --retry-delay 5 https://huggingface.co/datasets/HAL-9001/spider-databases/resolve/main/spider_data.zip -o /tmp/spider/source.zip
          echo "$SPIDER_SHA256  /tmp/spider/source.zip" | sha256sum -c -
          unzip -q /tmp/spider/source.zip -d /tmp/spider/extract
          TRAIN_JSON="$(find /tmp/spider/extract -type f -name train_spider.json ! -path '*/__MACOSX/*' | head -n1)"
          DEV_JSON="$(find /tmp/spider/extract -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)"
          DB_ROOT="$(dirname "$TRAIN_JSON")/database"
          TABLES_JSON="$(find /tmp/spider/extract -type f -name tables.json ! -path '*/__MACOSX/*' | head -n1)"
          test -n "$TABLES_JSON"
          echo "TRAIN_JSON=$TRAIN_JSON" >> "$GITHUB_ENV"
          echo "DEV_JSON=$DEV_JSON" >> "$GITHUB_ENV"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
          echo "TABLES_JSON=$TABLES_JSON" >> "$GITHUB_ENV"
      - name: Start original Qwen3.5-9B on free GitHub CPU
        run: |
          curl -fsSL --retry 3 https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          ollama pull qwen3.5:9b-q4_K_M
      - name: Original Qwen9B Guarded vs published physical FK source, same inference budgets
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python -m evaluation.qwen_published_fk_spider --train "$TRAIN_JSON" --dev "$DEV_JSON" --db-root "$DB_ROOT" --tables "$TABLES_JSON" --manifest spider-published-fk-frozen.json --shard "$SHARD" --output "spider-published-fk-shard-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spider-published-fk-${{ matrix.shard }}
          path: spider-published-fk-shard-*.json
          if-no-files-found: warn

  aggregate:
    needs: paired
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: spider-published-fk-*
          path: shards
          merge-multiple: true
      - name: Matched strict set and bag physical execution match, costs, and regressions
        run: |
          python -m evaluation.qwen_published_fk_spider --inputs shards/spider-published-fk-shard-0.json shards/spider-published-fk-shard-1.json shards/spider-published-fk-shard-2.json --output spider-published-fk-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spider-published-fk-final
          path: spider-published-fk-final.json
          if-no-files-found: error
