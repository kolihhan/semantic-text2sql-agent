name: PRO fixed Qwen9B semantic EX using ONLY referenced column raw SQLite types (new TRAIN DBs)
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - experiments/qwen9b_column_type8.py
      - tests/test_qwen9b_column_type8.py
      - .github/workflows/pro-qwen9b-column-type8.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Test gold-blind source isolation and strict scoring before inference
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_qwen9b_column_type8.py
          python -m compileall -q experiments/qwen9b_column_type8.py
      - name: Obtain immutable source BIRD TRAIN + BIRD DEV excluded DB identities
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 https://huggingface.co/datasets/Emulated-Inc/text-to-sql-with-evidence-training-pool/resolve/cd2c4ea321075aa53ce7dfe52deaaffa505d046a/raw/bird/train.json -o train.json
          echo "cd5884489dffd7c76d73509b396bd919fbe8b486efbc4ba2f48f89460de7d69f  train.json" | sha256sum -c -
          curl -fsSL --retry 5 "https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/3c11fb193e5439b338e23677fa0aae11e8b85db9/data/dev_20251106-00000-of-00001.json?download=true" -o dev.json
          echo "ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb  dev.json" | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43888747753
          github-token: ${{ github.token }}
          name: qwen9b-birdtrain-db-disjoint-original-sql-sft-candidates
          path: prior
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43904889296
          github-token: ${{ github.token }}
          name: qwen9b-fk-correction-prospective-source32-frozen
          path: prior-fk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43920461939
          github-token: ${{ github.token }}
          name: qwen9b-newdb-physical-value16-source-freeze
          path: prior-value16
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43926576493
          github-token: ${{ github.token }}
          name: qwen9b-second-newdb-physical-value16-source-freeze
          path: prior-value16-replica
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 44012242171
          github-token: ${{ github.token }}
          name: qwen9b-third-newdb-role8-source-freeze
          path: prior-role
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 44040520571
          github-token: ${{ github.token }}
          name: qwen9b-semantic-preview8-36db-excluded-frozen
          path: prior-preview
      - name: SHA-freeze 8 numeric-relational cases on 4 newly unused BIRD TRAIN source DBs, exclude 40 prior DBs
        shell: bash
        run: |
          set -euo pipefail
          python -m experiments.qwen9b_column_type8 --source-only \
            --train train.json --dev dev.json \
            --prior-train prior/train.jsonl \
            --prior-validation prior/validation.jsonl \
            --prior-fk32 prior-fk/prospective32.jsonl \
            --prior-value16 prior-value16/physical-value16.jsonl \
            --prior-value16-replica prior-value16-replica/physical-value16.jsonl \
            --prior-role8 prior-role/role-scoped8.jsonl \
            --prior-preview8 prior-preview/semantic-preview8.jsonl \
            --work preview-sqlite-sources --out frozen
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          m=json.loads(Path('frozen/freeze.json').read_text())
          rows=[json.loads(line) for line in Path('frozen/column-type8.jsonl').read_text().splitlines()]
          assert len(rows)==m['n']==8 and len(set(r['db_id'] for r in rows))==4
          assert m['excluded_prior_train_dbs']==40 and m['exclude_all_11_dev_dbs']
          assert m['source_sha256']==hashlib.sha256(Path('frozen/column-type8.jsonl').read_bytes()).hexdigest()
          assert m['gold_not_used_for_treatment'] and m['no_training']
          print('FROZEN_RAW_COLUMN_TYPE_8',m['source_sha256'],m['source_dbs'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen9b-column-type8-40db-excluded-frozen
          path: frozen/
          if-no-files-found: error
          retention-days: 30
  paired:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: '8192'
      OLLAMA_NUM_PARALLEL: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qwen9b-column-type8-40db-excluded-frozen
          path: frozen
      - name: Start original fixed Qwen3.5-9B Ollama CPU; no adapter or teacher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3.5:9b-q4_K_M
      - name: Same Qwen baseline versus same-Qwen source-column-type/value semantic audit; exact paired EX
        shell: bash
        env:
          SHARD: "${{ matrix.shard }}"
        run: |
          set -euo pipefail
          python -m experiments.qwen9b_column_type8 \
            --cohort frozen/column-type8.jsonl \
            --meta frozen/freeze.json \
            --shard "$SHARD" --work source-sqlite \
            --out "preview8-shard-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: "qwen9b-column-type8-physical-shard-${{ matrix.shard }}"
          path: preview8-shard-*.json
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    if: always()
    needs: paired
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qwen9b-column-type8-physical-shard-*
          path: shards
          merge-multiple: true
      - name: All 8 physical paired SQL tasks from four distinct databases required
        shell: bash
        run: |
          set -euo pipefail
          python -m experiments.qwen9b_column_type8 \
            --inputs shards/preview8-shard-*.json \
            --out preview8-complete.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen9b-column-type8-full-aggregate-only
          path: preview8-complete.json
          if-no-files-found: warn
          retention-days: 30
