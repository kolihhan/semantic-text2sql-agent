name: BIRD 5-minute Research Coordinator

# Only experiment infrastructure is deployed to main. Research branches and
# unproven adaptive LangGraph behavior are not merged or promoted here.
on:
  schedule:
    - cron: '2-59/5 * * * *' # UTC minutes 02,07,...57; avoids busiest :00 slot
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bird-hybrid-five-minute.yml'
      - 'scripts/bird_hybrid_scheduler.py'
      - 'research/bird-hybrid-plan.json'
      - 'tests/test_bird_hybrid_scheduler.py'

permissions:
  contents: read
  actions: write

concurrency:
  group: bird-5min-research-coordinator
  cancel-in-progress: false

jobs:
  research-scheduler:
    name: CPU-only BIRD research gate (never Qwen by itself)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout reviewed default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Validate full state-machine test suite on deployment/manual dispatch
        if: github.event_name != 'schedule'
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_bird_hybrid_scheduler.py
      - name: Schedule only approved fixed-Qwen BIRD experiments (zero GPU)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/bird_hybrid_scheduler.py --plan research/bird-hybrid-plan.json
