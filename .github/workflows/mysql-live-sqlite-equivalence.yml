name: MySQL 8.4 semantic portability execution smoke (real database engine)
on:
  workflow_dispatch:
  push:
    branches: [experiment/sql-sft-mysql-semantic-patterns-20261113]
    paths: [.github/SQL_MYSQL_LIVE_START]
permissions:
  contents: read
jobs:
  mysql-sqlite-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testing-only-root
          MYSQL_DATABASE: sql_semantic_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: testing-only-user
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ptesting-only-root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install SQL project, SQLGlot and MySQL driver
        run: python -m pip install -e ".[dev]" 'mysql-connector-python>=9,<10'
      - name: Compare actual MySQL and SQLite results for portable semantic SQL
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: ci
          MYSQL_PASSWORD: testing-only-user
          MYSQL_DB: sql_semantic_ci
        run: python -m experiments.mysql_live_semantic_smoke
