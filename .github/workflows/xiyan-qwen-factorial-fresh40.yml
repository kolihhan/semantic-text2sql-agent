name: XiYan7B vs Qwen9B 2x2 independent BIRD40
on:
  workflow_dispatch:
  push:
    branches: [experiment/xiyan-qwen-factorial-fresh40-20261113]
    paths: [.github/XIYAN_QWEN_FACTORIAL_START]
permissions:
  contents: read
  actions: read
concurrency:
  group: xiyan-qwen-factorial-fresh40-20261113
  cancel-in-progress: false
env:
  BIRD_SHA: cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630
  QWEN: qwen3.5:9b-q4_K_M
  XIYAN: hf.co/wanhin/XiYanSQL-QwenCoder-7B-2504-gguf:Q4_K_M

jobs:
  preregister:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Verify exact 2x2 contracts before seeing gold or models
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_xiyan_qwen_factorial_fresh40.py tests/test_semantic_shape_v3.py tests/test_semantic_v2.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43211214560
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: xiyan-semantic-independent100
          path: /tmp/previous/semantic
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43243969734
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: semantic-abc-paired100
          path: /tmp/previous/abc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43372535238
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: bird-bridge-paired100
          path: /tmp/previous/bridge
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43412255812
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: qwen9b-literal-paired40-recovered
          path: /tmp/previous/literal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43415738839
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: qwen9b-semantic-aa-paired20
          path: /tmp/previous/aa
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43440041923
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: sql-semantic-v2-fresh40-manifest
          path: /tmp/previous/fresh40
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 43448755639
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: sql-semantic-v3-fresh40-manifest
          path: /tmp/previous/v3fresh40
      - name: Download SHA256-pinned public BIRD and preregister new40
        run: |
          set -euo pipefail
          mkdir -p /tmp/bird
          curl --http1.1 -fL --retry 5 --retry-all-errors --retry-delay 2 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "$BIRD_SHA  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          DEV_JSON="$(find /tmp/bird/unpacked -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)"
          test -s "$DEV_JSON"
          python -m evaluation.xiyan_qwen_factorial_fresh40 \
            --source "$DEV_JSON" \
            --exclude runs/bird-paired-dev-v4/paired.json \
              /tmp/previous/semantic/xiyan-semantic-independent100.json \
              /tmp/previous/abc/semantic-abc-paired100.json \
              /tmp/previous/bridge/bird-bridge-paired100.json \
              /tmp/previous/literal/qwen9b-literal-paired40.json \
              /tmp/previous/aa/semantic-aa-paired20.json \
              /tmp/previous/fresh40/fresh40-manifest.json \
              /tmp/previous/v3fresh40/fresh40-manifest.json \
            --output factorial-manifest.json
          python - <<'PY'
          import json
          m=json.load(open("factorial-manifest.json"))
          assert len(m["selected"])==40 and m["excluded_identity_count"]==540
          assert m["strata"]=={"count_intent":20,"control":20}
          assert m["gold_used_for_selection"] is False
          assert m["gold_used_for_generation"] is False
          print("FROZEN_FACTORIAL_COHORT",m["distinct_databases_by_stratum"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xiyan-qwen-2x2-manifest
          path: factorial-manifest.json
          if-no-files-found: error
          retention-days: 30

  inference:
    needs: preregister
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: xiyan-qwen-2x2-manifest
          path: /tmp/cohort
      - name: Get same public BIRD question and SQLite bytes as preregistration
        run: |
          set -euo pipefail
          mkdir -p /tmp/bird
          curl --http1.1 -fL --retry 5 --retry-all-errors --retry-delay 2 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "$BIRD_SHA  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          DEV_JSON="$(find /tmp/bird/unpacked -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)"
          DB_ZIP="$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)"
          test -s "$DEV_JSON" && test -s "$DB_ZIP"
          mkdir -p /tmp/bird/databases
          unzip -q "$DB_ZIP" -d /tmp/bird/databases
          DB_ROOT="$(find /tmp/bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)"
          if [ -z "$DB_ROOT" ]; then DB_ROOT=/tmp/bird/databases; fi
          test -d "$DB_ROOT"
          echo "DEV_JSON=$DEV_JSON" >> "$GITHUB_ENV"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
      - name: Install Ollama, download both fixed models and pin Qwen identity
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          OLLAMA_MAX_LOADED_MODELS=1 ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull "$QWEN"
          ollama pull "$XIYAN"
          python - <<'PY'
          from evaluation.run_bird import _ollama_model_digest
          q=_ollama_model_digest("http://127.0.0.1:11434","qwen3.5:9b-q4_K_M")
          x=_ollama_model_digest("http://127.0.0.1:11434","hf.co/wanhin/XiYanSQL-QwenCoder-7B-2504-gguf:Q4_K_M")
          assert q == "56671c2ab9385f9cfcb404638e32cd62d88e3501d44822208363c010179a3c90"
          assert len(x)==64
          print("PINNED_FACTORIAL_MODELS",{"qwen_digest":q,"xiyan_digest":x})
          PY
      - name: Generate four 2x2 arms on same five frozen questions
        run: |
          set -euo pipefail
          python -m evaluation.xiyan_qwen_factorial_fresh40 \
            --source "$DEV_JSON" --database-root "$DB_ROOT" \
            --manifest /tmp/cohort/factorial-manifest.json \
            --shard "${{ matrix.shard }}" \
            --output "factorial-shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: xiyan-qwen-2x2-shard-${{ matrix.shard }}
          path: factorial-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: inference
    if: ${{ always() && needs.inference.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: xiyan-qwen-2x2-shard-*
          merge-multiple: true
          path: shards
      - name: Verify exactly four arms, 40 paired questions, models and transitions
        run: |
          set -euo pipefail
          for n in {0..7}; do test -s "shards/factorial-shard-$n.json"; done
          python -m evaluation.xiyan_qwen_factorial_fresh40 \
            --inputs shards/factorial-shard-0.json shards/factorial-shard-1.json \
                     shards/factorial-shard-2.json shards/factorial-shard-3.json \
                     shards/factorial-shard-4.json shards/factorial-shard-5.json \
                     shards/factorial-shard-6.json shards/factorial-shard-7.json \
            --output xiyan-qwen-2x2-final.json
          python - <<'PY'
          import json
          r=json.load(open("xiyan-qwen-2x2-final.json"))
          assert r["schema"]=="bird-2x2-xiyan-qwen-aggregate/v1"
          assert r["n"]==40 and len(r["overall"]["arms"])==4
          assert r["same_source_schema_database_scorer"] is True
          assert r["gold_used_for_generation"] is False
          print("XIYAN_QWEN_FACTORIAL_RESULT",json.dumps({k:v for k,v in r.items() if k!="cases"},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xiyan-qwen-2x2-measured
          path: xiyan-qwen-2x2-final.json
          retention-days: 30
          if-no-files-found: error
