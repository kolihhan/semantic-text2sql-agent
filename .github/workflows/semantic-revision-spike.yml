name: Semantic revision spike

on:
  push:
    branches: [semantic-revision-spike]
    paths:
      - experiments/semantic_revision_spike.py
      - .github/workflows/semantic-revision-spike.yml

jobs:
  review-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull frozen model
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull qwen3.5:4b

      - name: Run semantic revision sample
        run: python experiments/semantic_revision_spike.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-revision-results
          path: semantic-revision-results.json
          if-no-files-found: ignore
