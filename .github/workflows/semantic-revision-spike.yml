name: Frozen-100 XiYan direct A/B

on:
  push:
    branches: [semantic-revision-spike]
    paths:
      - experiments/frozen100_direct_model_ab.py
      - .github/workflows/semantic-revision-spike.yml

permissions:
  contents: write

jobs:
  frozen100-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Ollama binary
        run: curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr

      - name: Start Ollama and pull XiYanSQL Q4
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull hf.co/wanhin/XiYanSQL-QwenCoder-7B-2504-gguf:Q4_K_M

      - name: Download canonical BIRD dev release
        run: |
          mkdir -p /tmp/bird
          curl -fL --retry 3 https://bird-bench.oss-cn-beijing.aliyuncs.com/dev.zip -o /tmp/bird/dev.zip
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          DEV_JSON=$(find /tmp/bird/unpacked -type f -name dev.json | head -n1)
          DB_ZIP=$(find /tmp/bird/unpacked -type f -name dev_databases.zip | head -n1)
          test -n "$DEV_JSON"
          test -n "$DB_ZIP"
          mkdir -p /tmp/bird/databases
          unzip -q "$DB_ZIP" -d /tmp/bird/databases
          echo "DEV_JSON=$DEV_JSON" >> "$GITHUB_ENV"
          DB_ROOT=$(find /tmp/bird/databases -type d -name dev_databases | head -n1)
          if [ -z "$DB_ROOT" ]; then DB_ROOT=/tmp/bird/databases; fi
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
          sha256sum "$DEV_JSON"

      - name: Run frozen 100 direct-only XiYan A/B
        run: |
          python experiments/frozen100_direct_model_ab.py \
            --source "$DEV_JSON" \
            --database-root "$DB_ROOT" \
            --model hf.co/wanhin/XiYanSQL-QwenCoder-7B-2504-gguf:Q4_K_M \
            --output frozen100-xiyan-direct.json

      - name: Commit result to spike branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frozen100-xiyan-direct.json
          git commit -m "Record frozen-100 XiYan direct results" || exit 0
          git push

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen100-xiyan-direct
          path: frozen100-xiyan-direct.json
          if-no-files-found: ignore
