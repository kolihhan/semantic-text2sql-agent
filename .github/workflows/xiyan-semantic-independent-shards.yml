name: XiYan independent semantic SQL audit — four CPU Ollama shards

on:
  workflow_dispatch:
  push:
    branches: [experiment/xiyan-semantic-shards-20261112]
    paths:
      - .github/SEMANTIC_SHARD_TRIGGER

permissions:
  contents: read
  actions: read

env:
  MODEL: hf.co/wanhin/XiYanSQL-QwenCoder-7B-2504-gguf:Q4_K_M

jobs:
  treatment:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout frozen experiment branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SQL project, tests and SQLGlot
        run: python -m pip install -e ".[dev]"
      - name: Verify local semantic selector contracts
        run: python -m pytest -q tests/test_xiyan_semantic_shards.py
      - name: Install standalone CPU Ollama
        run: curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
      - name: Start Ollama and pull exact XiYan 7B GGUF
        run: |
          set -euo pipefail
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull "$MODEL"
      - name: Fetch checksum-pinned BIRD DEV and SQLite databases
        run: |
          set -euo pipefail
          mkdir -p /tmp/bird
          curl -fL --retry 4 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          DEV_JSON="$(find /tmp/bird/unpacked -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)"
          DB_ZIP="$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)"
          test -f "$DEV_JSON" && test -f "$DB_ZIP"
          mkdir -p /tmp/bird/databases
          unzip -q "$DB_ZIP" -d /tmp/bird/databases
          DB_ROOT="$(find /tmp/bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)"
          if [ -z "$DB_ROOT" ]; then DB_ROOT=/tmp/bird/databases; fi
          test -d "$DB_ROOT"
          echo "DEV_JSON=$DEV_JSON" >> "$GITHUB_ENV"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
      - name: Generate paired M-Schema and semantic-audited SQL without gold in prompt
        run: |
          set -euo pipefail
          python -m experiments.xiyan_semantic_shards \
            --source "$DEV_JSON" \
            --database-root "$DB_ROOT" \
            --frozen runs/bird-paired-dev-v4/paired.json \
            --model "$MODEL" \
            --num-shards 4 \
            --shard-index "${{ matrix.shard }}" \
            --count 100 \
            --output "xiyan-semantic-shard-${{ matrix.shard }}.json"
      - name: Upload shard candidate and offline paired EX evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xiyan-semantic-shard-${{ matrix.shard }}
          path: xiyan-semantic-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: treatment
    if: ${{ always() && needs.treatment.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: xiyan-semantic-shard-*
          path: shards
          merge-multiple: true
      - name: Aggregate identical independent BIRD100 paired semantic EX
        run: |
          set -euo pipefail
          python -m experiments.xiyan_semantic_shards \
            --inputs shards/xiyan-semantic-shard-0.json shards/xiyan-semantic-shard-1.json shards/xiyan-semantic-shard-2.json shards/xiyan-semantic-shard-3.json \
            --min-gain 3 \
            --output xiyan-semantic-independent100.json
          python - <<'PY'
          import json
          data=json.load(open("xiyan-semantic-independent100.json",encoding="utf-8"))
          assert data["sample_size"]==100
          assert len({r["case_id"] for r in data["cases"]})==100
          print("INDEPENDENT_SEMANTIC_RESULT",json.dumps({
              k:v for k,v in data.items() if k!="cases"
          },sort_keys=True,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xiyan-semantic-independent100
          path: xiyan-semantic-independent100.json
          if-no-files-found: error
          retention-days: 30
