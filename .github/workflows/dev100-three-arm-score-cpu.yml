name: CPU-only historical DEV100 Direct vs Workflow vs LangGraph score
on:
  push:
    branches: [research/dev100-matched-etsa-g012-20261123]
    paths:
      - .github/workflows/dev100-three-arm-score-cpu.yml
      - experiments/compare_three_arms.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_URL: https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/3c11fb193e5439b338e23677fa0aae11e8b85db9/data/dev_20251106-00000-of-00001.json?download=true
  SOURCE_SHA: ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb
  DB_ZIP_SHA: cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630

jobs:
  score-three-arms:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Download exact frozen DEV100 without gold
        uses: actions/download-artifact@v4
        with:
          run-id: 45107955598
          github-token: ${{ github.token }}
          name: gold-free-fixed-dev100
          path: frozen
      - name: Download original sealed inference shard 0
        uses: actions/download-artifact@v4
        with:
          run-id: 45107955598
          github-token: ${{ github.token }}
          name: etsa-data-0
          path: shards
      - name: Download original sealed inference shard 2
        uses: actions/download-artifact@v4
        with:
          run-id: 45107955598
          github-token: ${{ github.token }}
          name: etsa-data-2
          path: shards
      - name: Download original sealed inference shard 3
        uses: actions/download-artifact@v4
        with:
          run-id: 45107955598
          github-token: ${{ github.token }}
          name: etsa-data-3
          path: shards
      - name: Download recovered inference shard 1 (case 121 only retried)
        uses: actions/download-artifact@v4
        with:
          run-id: 45119482993
          github-token: ${{ github.token }}
          name: etsa-shard-1-recovered
          path: shards
      - name: Download completed prior 100-case score to cross-check B and C
        uses: actions/download-artifact@v4
        with:
          run-id: 45119482993
          github-token: ${{ github.token }}
          name: dev100-g012-strict-ex-cost-recovered
          path: previous
      - name: Download SHA-pinned publisher source ONLY for scoring
        run: |
          curl -fL --retry 3 "$SOURCE_URL" -o frozen/publisher.json
          echo "$SOURCE_SHA  frozen/publisher.json" | sha256sum -c -
      - name: Download SHA-pinned original physical BIRD databases
        run: bash experiments/dev100_setup_bird.sh
      - name: CPU-only strict SET/BAG on identical 100 SQL generations
        run: |
          python -m experiments.compare_three_arms \
            --frozen frozen/dev100-gold-free.json \
            --shards shards \
            --source frozen/publisher.json \
            --db-root "$DB_ROOT" \
            --previous previous/dev100-g012-scored.json \
            --output dev100-three-arm-score.json
      - name: Archive per-case Direct versus Workflow versus LangGraph scoring
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev100-three-arm-strict-score
          path: dev100-three-arm-score.json
          if-no-files-found: warn
