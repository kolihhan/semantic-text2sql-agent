name: One-time main-only cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-main-only-cleanup.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  archive-and-prune:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify branch-head recovery index
        run: |
          test -s docs/archived-branch-heads-20261126.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("docs/archived-branch-heads-20261126.json").read_text())
          assert d["default_branch"]=="main"
          assert len(d["branch_heads"])>=188
          print("BRANCH_SHA_RECOVERY_INDEX_READY",len(d["branch_heads"]))
          PY
      - name: Close open pull requests and delete all non-main branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          repo=os.environ["GITHUB_REPOSITORY"]
          assert repo=="kolihhan/semantic-text2sql-agent",repo
          base="https://api.github.com/repos/"+repo
          token=os.environ["GH_TOKEN"]

          def api(method,path,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(
                  base+path, data=data, method=method,
                  headers={
                      "Accept":"application/vnd.github+json",
                      "Authorization":"Bearer "+token,
                      "X-GitHub-Api-Version":"2022-11-28",
                      "Content-Type":"application/json",
                  },
              )
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req,timeout=45) as resp:
                          body=resp.read()
                          return json.loads(body) if body else None
                  except urllib.error.HTTPError as exc:
                      if exc.code in (403,429,500,502,503) and attempt<3:
                          time.sleep(15*(attempt+1))
                          continue
                      print("API_FAILURE",method,path,"HTTP",exc.code,exc.read().decode()[:300],flush=True)
                      raise

          def paged(path):
              out=[]
              for page in range(1,6):
                  chunk=api("GET",path+"?per_page=100&page="+str(page))
                  assert isinstance(chunk,list)
                  out.extend(chunk)
                  if len(chunk)<100: break
              return out

          metadata=api("GET","")
          assert metadata["default_branch"]=="main"
          branches=paged("/branches")
          prs=paged("/pulls")
          others=[b["name"] for b in branches if b["name"]!="main"]
          print("CLEANUP_INITIAL",len(prs),len(branches),flush=True)
          assert len(branches)>180, "Unexpected branch set; no deletion"
          assert all(not b["protected"] for b in branches if b["name"]!="main"),"Protected branch; stop"

          for index,p in enumerate(prs,1):
              api("PATCH","/pulls/"+str(p["number"]),{"state":"closed"})
              print("PR_CLOSED",index,p["number"],flush=True)
              time.sleep(1.05)

          assert not paged("/pulls"),"Open PRs remain; do not delete branches"
          for index,name in enumerate(others,1):
              ref=urllib.parse.quote("heads/"+name,safe="/")
              api("DELETE","/git/refs/"+ref)
              print("BRANCH_DELETED",index,name,flush=True)
              time.sleep(1.05)

          actual=paged("/branches")
          remaining=paged("/pulls")
          print("CLEANUP_FINAL",len(actual),len(remaining),[b["name"] for b in actual],flush=True)
          assert len(actual)==1 and actual[0]["name"]=="main" and not remaining
          print("MAIN_ONLY_AND_NO_OPEN_PRS_VERIFIED",flush=True)
          PY
