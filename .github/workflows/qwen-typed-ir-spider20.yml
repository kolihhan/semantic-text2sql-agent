name: Qwen9B typed-IR vs original Guarded on unused Spider TRAIN schemas
on:
  workflow_dispatch:
  push:
    branches: [experiment/qwen-typed-ir-source-gate-20261115]
    paths: [.github/QWEN_TYPED_IR_RUN_START]
permissions:
  contents: read
env:
  SPIDER_SHA256: 00636695dabed6b5f4b8328a16b13e069a2f16591d5efcce57660669c85b121b

jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_typed_query_ir.py tests/test_qwen_typed_ir_spider20.py
      - name: Freeze source and confirm 10 DBs outside earlier Spider 100, no model calls
        run: |
          set -euo pipefail
          mkdir -p /tmp/spider
          curl -fL --retry 3 --retry-delay 5 \
            https://huggingface.co/datasets/HAL-9001/spider-databases/resolve/main/spider_data.zip \
            -o /tmp/spider/source.zip
          echo "$SPIDER_SHA256  /tmp/spider/source.zip" | sha256sum -c -
          unzip -q /tmp/spider/source.zip -d /tmp/spider/extract
          TRAIN_JSON="$(find /tmp/spider/extract -type f -name train_spider.json ! -path '*/__MACOSX/*' | head -n1)"
          DEV_JSON="$(find /tmp/spider/extract -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)"
          export TRAIN_JSON DEV_JSON
          python - <<'PY'
          import json,os
          from pathlib import Path
          from evaluation.qwen_typed_ir_spider20 import select_cases
          train=json.loads(Path(os.environ["TRAIN_JSON"]).read_text())
          dev=json.loads(Path(os.environ["DEV_JSON"]).read_text())
          rows=select_cases(train,dev)
          root=Path(os.environ["TRAIN_JSON"]).parent/"database"
          assert len(rows)==20 and len({x["database_id"] for x in rows})==10
          for row in rows:
              db=root/row["database_id"]/(row["database_id"]+".sqlite")
              assert db.is_file(),db
              assert "query" not in row
          print("QWEN_TYPED_IR_SPIDER_SOURCE_ONLY_PASS",{"train":len(train),"dev":len(dev),"chosen":len(rows),"dbs":10})
          PY

  paired:
    needs: source-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 220
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Restore pinned, source-verified public Spider archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/spider
          curl -fL --retry 3 --retry-delay 5 \
            https://huggingface.co/datasets/HAL-9001/spider-databases/resolve/main/spider_data.zip \
            -o /tmp/spider/source.zip
          echo "$SPIDER_SHA256  /tmp/spider/source.zip" | sha256sum -c -
          unzip -q /tmp/spider/source.zip -d /tmp/spider/extract
          TRAIN_JSON="$(find /tmp/spider/extract -type f -name train_spider.json ! -path '*/__MACOSX/*' | head -n1)"
          DEV_JSON="$(find /tmp/spider/extract -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)"
          DB_ROOT="$(dirname "$TRAIN_JSON")/database"
          test -d "$DB_ROOT"
          echo "TRAIN_JSON=$TRAIN_JSON" >> "$GITHUB_ENV"
          echo "DEV_JSON=$DEV_JSON" >> "$GITHUB_ENV"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
      - name: Pull original Qwen3.5 9B only
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          OLLAMA_MAX_LOADED_MODELS=1 ollama serve > "$RUNNER_TEMP/ollama-ir.log" 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          ollama pull qwen3.5:9b-q4_K_M
      - name: Qwen Guarded versus typed-IR plus original Guarded fallback
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python -m evaluation.qwen_typed_ir_spider20 \
            --train "$TRAIN_JSON" --dev "$DEV_JSON" --db-root "$DB_ROOT" \
            --shard "$SHARD" --output "qwen-ir-spider-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-ir-spider-shard-${{ matrix.shard }}
          path: qwen-ir-spider-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: paired
    if: ${{ always() && needs.paired.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qwen-ir-spider-shard-*
          path: shards
          merge-multiple: true
      - run: |
          set -euo pipefail
          python -m evaluation.qwen_typed_ir_spider20 \
            --inputs shards/qwen-ir-spider-0.json shards/qwen-ir-spider-1.json \
                     shards/qwen-ir-spider-2.json shards/qwen-ir-spider-3.json \
                     shards/qwen-ir-spider-4.json \
            --output qwen-ir-spider20-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-typed-ir-spider20-final
          path: qwen-ir-spider20-final.json
          if-no-files-found: error
          retention-days: 30
