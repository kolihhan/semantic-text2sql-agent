name: XiYan M-Schema vs relational grounding A4 on Spider cross-source 100

on:
  workflow_dispatch:
  push:
    branches: [experiment/sql-grounding-spider-shift-20261113]
    paths: [.github/SPIDER_SHIFT_START]

permissions:
  contents: read

env:
  MODEL: hf.co/wanhin/XiYanSQL-QwenCoder-7B-2504-gguf:Q4_K_M
  SPIDER_SHA256: 00636695dabed6b5f4b8328a16b13e069a2f16591d5efcce57660669c85b121b

jobs:
  spider-compare:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout frozen, already-tested v2 grounding implementation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ff7df9754f2ed7ff5f6eef45b831261a2a28ca7d
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install and verify all matching-data protocols
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_relational_grounding_v2.py tests/test_spider_grounding_shift.py
      - name: Download the SHA256-pinned Spider SQLite, not BIRD DEV
        run: |
          set -euo pipefail
          mkdir -p /tmp/spider-dataset
          curl -fL --retry 4 --retry-delay 5 \
            https://huggingface.co/datasets/HAL-9001/spider-databases/resolve/main/spider_data.zip \
            -o /tmp/spider-dataset/spider_data.zip
          echo "$SPIDER_SHA256  /tmp/spider-dataset/spider_data.zip" | sha256sum -c -
          unzip -q /tmp/spider-dataset/spider_data.zip -d /tmp/spider-dataset/extract
          SPIDER_JSON="$(find /tmp/spider-dataset/extract -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)"
          test -n "$SPIDER_JSON"
          SPIDER_ROOT="$(dirname "$SPIDER_JSON")"
          DB_ROOT="$SPIDER_ROOT/database"
          test -d "$DB_ROOT"
          test "$(find "$DB_ROOT" -type f -name '*.sqlite' | wc -l)" -ge 20
          echo "SPIDER_JSON=$SPIDER_JSON" >> "$GITHUB_ENV"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
          python - <<'PY'
          import json,os
          with open(os.environ["SPIDER_JSON"],encoding="utf8") as f: rows=json.load(f)
          ids={str(x.get("db_id","")) for x in rows}
          assert len(rows)>=100 and len(ids)>=10
          print("SPIDER_CROSS_SOURCE_PREFLIGHT",{"public_dev_questions":len(rows),"databases":len(ids)})
          PY
      - name: Install CPU Ollama and SAME XiYan 7B model
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          ollama serve > /tmp/ollama-spider.log 2>&1 &
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull "$MODEL"
      - name: Generate A0 baseline and A4 relational-grounded SQL, score ONLY after both are frozen
        shell: bash
        run: |
          set -euo pipefail
          python -m experiments.spider_grounding_shift \
            --source "$SPIDER_JSON" --database-root "$DB_ROOT" \
            --shard-index "${{ matrix.shard }}" --model "$MODEL" \
            --output spider-shard-${{ matrix.shard }}.json
      - name: Archive full paired, label-after-generation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spider-grounding-shard-${{ matrix.shard }}
          path: spider-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  summarize:
    needs: spider-compare
    if: ${{ always() && needs.spider-compare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ff7df9754f2ed7ff5f6eef45b831261a2a28ca7d
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install core package and scorer
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: spider-grounding-shard-*
          path: shards
          merge-multiple: true
      - name: Aggregate exact paired source-shift correctness
        run: |
          python -m experiments.spider_grounding_shift \
            --inputs shards/spider-shard-0.json shards/spider-shard-1.json \
                     shards/spider-shard-2.json shards/spider-shard-3.json \
            --output spider-a0-vs-a4-exec-paired100.json
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path("spider-a0-vs-a4-exec-paired100.json").read_text())
          assert row["requested_cases"]==100
          assert row["wrong_to_correct"]-row["correct_to_wrong"]==row["net_gain"]
          print("SPIDER_GROUNDING_PAIRED_FINAL",json.dumps({
            k:v for k,v in row.items() if k!="cases"
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spider-relational-grounding-paired100
          path: spider-a0-vs-a4-exec-paired100.json
          if-no-files-found: error
          retention-days: 30
