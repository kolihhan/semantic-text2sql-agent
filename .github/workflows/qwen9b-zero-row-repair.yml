name: Qwen3.5 9B zero-row repair diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/ZERO_ROW_REPAIR_TRIGGER"

permissions:
  contents: read
  actions: read

env:
  SOURCE_HF_COMMIT: 3c11fb193e5439b338e23677fa0aae11e8b85db9
  SOURCE_RAW_SHA256: ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb
  DB_ZIP_SHA256: cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630
  BASELINE_RUN_ID: "37307108955"
  MODEL: qwen3.5:9b-q4_K_M

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experiment
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Download pinned BIRD source
        run: |
          mkdir -p frozen-inputs
          curl -fL --retry 3 \
            "https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/${SOURCE_HF_COMMIT}/data/dev_20251106-00000-of-00001.json?download=true" \
            -o frozen-inputs/bird-sql-dev.json
          echo "${SOURCE_RAW_SHA256}  frozen-inputs/bird-sql-dev.json" | sha256sum -c -

      - name: Download exact frozen 9B shard artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen-artifacts
          for shard in 0 1 2 3; do
            gh run download "$BASELINE_RUN_ID" \
              --repo "${GITHUB_REPOSITORY}" \
              -n "qwen9b-xiyan-style-shard-${shard}" \
              -D "frozen-artifacts/shard-${shard}"
          done
          find frozen-artifacts -type f -maxdepth 2 -print

      - name: Download and extract historical database package
        run: |
          mkdir -p /tmp/bird
          curl -fL --retry 3 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "${DB_ZIP_SHA256}  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          DB_ZIP=$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)
          test -n "$DB_ZIP"
          mkdir -p /tmp/bird/databases
          unzip -q "$DB_ZIP" -d /tmp/bird/databases
          DB_ROOT=$(find /tmp/bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)
          if [ -z "$DB_ROOT" ]; then DB_ROOT=/tmp/bird/databases; fi
          test -d "$DB_ROOT"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr

      - name: Start Ollama and pull exact model tag
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull "$MODEL"

      - name: Verify model digest matches frozen baseline
        run: |
          python - <<'PY'
          import glob, json, os, urllib.request
          old = json.load(open(sorted(glob.glob('frozen-artifacts/**/*.json', recursive=True))[0]))
          expected = old['model_digest']
          tags = json.load(urllib.request.urlopen('http://127.0.0.1:11434/api/tags'))['models']
          row = next(item for item in tags if (item.get('name') or item.get('model')) == os.environ['MODEL'])
          actual = row['digest']
          assert actual == expected, (actual, expected)
          print('MODEL_DIGEST_MATCH', actual)
          PY

      - name: Run bounded 12-case diagnostic
        run: |
          python experiments/qwen9b_zero_row_repair.py \
            --source frozen-inputs/bird-sql-dev.json \
            --database-root "$DB_ROOT" \
            --artifact-dir frozen-artifacts \
            --model "$MODEL" \
            --timeout 600 \
            --output zero-row-repair-result.json
          cat zero-row-repair-result.json

      - name: Upload diagnostic result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen9b-zero-row-repair-diagnostic
          path: zero-row-repair-result.json
          if-no-files-found: warn
