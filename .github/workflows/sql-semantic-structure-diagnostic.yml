name: Qwen9B original semantic structure diagnostic (no training / no revisions)
on:
  workflow_dispatch:
  push:
    branches: [experiment/evidence-gated-semantic-v2-20261113]
    paths: [.github/SEMANTIC_STRUCTURE_DIAGNOSTIC_START]
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install and verify original SQL plus experimental opt-in gate
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_semantic_v2.py tests/test_guarded_direct_preflight.py
      - name: Download immutable Qwen9B original 40 frozen SQL pairs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 43412255812
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: qwen9b-literal-paired40-recovered
          path: /tmp/frozen40
      - name: Download immutable Qwen9B A/A20 frozen SQL triplets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 43415738839
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: qwen9b-semantic-aa-paired20
          path: /tmp/frozen20
      - name: Download SHA256-pinned original BIRD DEV (no SQL generation)
        run: |
          set -euo pipefail
          mkdir -p /tmp/bird
          curl -fL --retry 4 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          DEV_JSON="$(find /tmp/bird/unpacked -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)"
          DB_ZIP="$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)"
          test -s "$DEV_JSON" && test -s "$DB_ZIP"
          mkdir -p /tmp/bird/databases
          unzip -q "$DB_ZIP" -d /tmp/bird/databases
          DB_ROOT="$(find /tmp/bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)"
          if [ -z "$DB_ROOT" ]; then DB_ROOT=/tmp/bird/databases; fi
          test -d "$DB_ROOT"
          echo "DEV_JSON=$DEV_JSON" >> "$GITHUB_ENV"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
      - name: Diagnose original vs reference SQL clause structure (research only)
        run: |
          set -euo pipefail
          python -m evaluation.semantic_structure_diagnostic \
            --literal40 /tmp/frozen40/qwen9b-literal-paired40.json \
            --aa20 /tmp/frozen20/semantic-aa-paired20.json \
            --source "$DEV_JSON" \
            --database-root "$DB_ROOT" \
            --output semantic-structure-diagnostic60.json
          python - <<'PY'
          import json
          report=json.load(open("semantic-structure-diagnostic60.json"))
          assert report["schema"]=="qwen9b-semantic-structure-diagnostic60/v1"
          assert report["overall"]["total"]==60
          assert report["overall"]["correct"]==33
          assert report["no_generation_or_sql_selector"] is True
          assert report["promote"] is False
          print("SQL_SEMANTIC_MISMATCH_COUNTS", json.dumps(report["overall"], sort_keys=True))
          PY
      - name: Preserve measured AST diagnostic (not accuracy claim)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qwen9b-semantic-structure-diagnostic60
          path: semantic-v2-frozen60.json
          if-no-files-found: warn
          retention-days: 30
