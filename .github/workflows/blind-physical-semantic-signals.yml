name: Blind physical semantic signals Qwen9B
on:
  workflow_dispatch:
  push:
    branches: [research/physical-signal-blind-audit-20261122]
    paths: ['.github/workflows/blind-physical-semantic-signals.yml']
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: src:.
jobs:
  source_freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 37307108955
          github-token: ${{ github.token }}
          pattern: qwen9b-xiyan-style-shard-*
          merge-multiple: true
          path: /tmp/archived-shards
      - name: Prepare source-only candidates and original labels separately
        run: |
          python -m scripts.blind_physical_semantic_signals prepare --shard-dir /tmp/archived-shards --unlabeled /tmp/blind-source/candidates.json --labels /tmp/blind-labels/labels.json
      - uses: actions/upload-artifact@v4
        with:
          name: blind-candidates-before-scoring
          path: /tmp/blind-source/candidates.json
      - uses: actions/upload-artifact@v4
        with:
          name: original-labels-isolated-from-detector
          path: /tmp/blind-labels/labels.json
  detect_unlabeled:
    needs: source_freeze
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic controls
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_blind_physical_semantic_signals.py
      - uses: actions/download-artifact@v4
        with:
          name: blind-candidates-before-scoring
          path: /tmp/blind-source
      - name: Download verified original physical BIRD DEV databases
        run: |
          set -euo pipefail
          mkdir -p /tmp/bird/packed /tmp/bird/unpacked /tmp/bird/db
          curl -fLsS --retry 3 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/packed/dev.zip
          echo 'cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630  /tmp/bird/packed/dev.zip' | sha256sum -c -
          unzip -q /tmp/bird/packed/dev.zip -d /tmp/bird/unpacked
          NESTED=$(find /tmp/bird/unpacked -name dev_databases.zip -type f | head -n 1)
          test -n "$NESTED"
          unzip -q "$NESTED" -d /tmp/bird/db
          DB_ROOT=$(find /tmp/bird/db -type d -name dev_databases | head -n 1)
          if [ -z "$DB_ROOT" ]; then DB_ROOT=/tmp/bird/db; fi
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
      - name: Compute frozen label-free physical observations
        run: |
          python -u -m scripts.blind_physical_semantic_signals detect --unlabeled /tmp/blind-source/candidates.json --database-root "$DB_ROOT" --output /tmp/blind-signals/signals.json
      - uses: actions/upload-artifact@v4
        with:
          name: label-blind-physical-observations
          path: /tmp/blind-signals/signals.json
      - name: Gold-blind predicate contract on 75 original valid-shard SQLs
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.blind_physical_semantic_signals import _db_path
          from scripts.blind_predicate_contract_batch import diagnose, sha256
          source=json.loads(Path('/tmp/blind-source/candidates.json').read_text())
          db_root=Path(os.environ['DB_ROOT'])
          rows=[]
          for case in source['cases']:
              if case['shard']==3:
                  continue  # invalid original model shard
              db=_db_path(db_root,case['db_id'])
              if db is None:
                  raise RuntimeError('Missing physical database: '+case['db_id'])
              rows.append({'case_id':case['case_id'],'question':case['question'],
                           'selected_sql':case['selected_sql'],'database':str(db),
                           'database_sha256':sha256(db)})
          report=diagnose(rows,db_root)
          assert report['count']==75
          out=Path('/tmp/predicate-contract/report.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(report,indent=2)+'\n')
          print('PREDICATE_CONTRACT_REAL75_UNLABELED',json.dumps({
              k:report[k] for k in ('count','database_count','status_counts','reason_counts')}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: predicate-contract-original-valid75-gold-blind
          path: /tmp/predicate-contract/report.json
          if-no-files-found: error
  score_only_after_freeze:
    needs: detect_unlabeled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: label-blind-physical-observations
          path: /tmp/blind-signals
      - uses: actions/download-artifact@v4
        with:
          name: original-labels-isolated-from-detector
          path: /tmp/blind-labels
      - uses: actions/download-artifact@v4
        with:
          name: predicate-contract-original-valid75-gold-blind
          path: /tmp/predicate-contract
      - name: Evaluate frozen predicate flags against original strict EX
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/predicate-contract/report.json').read_text())
          raw=json.loads(Path('/tmp/blind-labels/labels.json').read_text())
          labels={x['case_id']:x for x in raw['labels']}
          flagged=[(x,labels[x['case_id']]) for x in p['cases'] if x['status']=='OBSERVED']
          missed=[(x,labels[x['case_id']]) for x in p['cases'] if x['status']=='ABSTAIN']
          assert len(p['cases'])==75 and len(flagged)+len(missed)==75
          result={'original_valid_n':75,'observed':len(flagged),
                  'observed_original_ex_wrong':sum(not y['strict_ex'] for x,y in flagged),
                  'observed_original_ex_right':sum(y['strict_ex'] for x,y in flagged),
                  'reason_counts':p['reason_counts'],
                  'accuracy_improvement':None,'no_sql_rewrites':True}
          print('PREDICATE_CONTRACT_REAL75_POST_FREEZE',json.dumps(result))
          Path('/tmp/predicate-contract/score.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: predicate-contract-valid75-historical-ex-crosstab
          path: /tmp/predicate-contract/score.json
          if-no-files-found: error
      - name: Cross-tab original Strict EX only after detector froze
        run: |
          python -m scripts.blind_physical_semantic_signals score --signals /tmp/blind-signals/signals.json --labels /tmp/blind-labels/labels.json --output /tmp/final-score/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-physical-observation-original-ex-cross-tab
          path: /tmp/final-score/report.json