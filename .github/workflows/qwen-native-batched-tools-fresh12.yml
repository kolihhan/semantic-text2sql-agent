name: PRO native Qwen9B batched real SQLite tools vs Guarded, 12 new BIRD DEV questions
on:
  push:
    branches: [experiment/qwen-tools-batched-bird12-fresh-20261116]
    paths: [.github/workflows/qwen-native-batched-tools-fresh12.yml, evaluation/qwen_observed_sql_tools.py, evaluation/qwen_tools_bird12.py, tests/test_qwen_observed_batched_tools.py, tests/test_qwen_observed_sql_tools.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Test native Qwen multi-tool batch, safety, source and strict EX gates
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_qwen_observed_sql_tools.py tests/test_qwen_observed_batched_tools.py tests/test_qwen_tools_bird12.py
      - name: Download pinned original BIRD DEV questions and freeze fresh source IDs
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 'https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/3c11fb193e5439b338e23677fa0aae11e8b85db9/data/dev_20251106-00000-of-00001.json?download=true' -o dev.json
          echo 'ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb  dev.json' | sha256sum -c -
          python -m evaluation.qwen_tools_bird12 \
            --source dev.json \
            --original runs/bird-paired-dev-v5/paired.json \
            --output fresh-native-batched-bird12-manifest.json
          python - <<'PY'
          import json
          x=json.load(open('fresh-native-batched-bird12-manifest.json'))
          assert x['n']==12 and x['db_count']==6
          assert x['excluded_original100_previous16_24_and_grain20']==160
          assert x['gold_used_to_select'] is False
          assert x['independent_question_ids_from_exposed_160'] is True
          assert len(x['cases'])==12
          print('QWEN_NEW_12_SOURCE_ONLY_PRE_REGISTERED',
                x['cases_sha'],[z['database_id'] for z in x['cases']],flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-native-batched-fresh-bird12-cohort
          path: fresh-native-batched-bird12-manifest.json
          if-no-files-found: error
  paired:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: '8192'
      OLLAMA_NUM_PARALLEL: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qwen-native-batched-fresh-bird12-cohort
      - name: Restore identical BIRD physical database and source SHA
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 'https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/3c11fb193e5439b338e23677fa0aae11e8b85db9/data/dev_20251106-00000-of-00001.json?download=true' -o dev.json
          echo 'ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb  dev.json' | sha256sum -c -
          curl -fsSL --retry 4 'https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip' -o dev.zip
          echo 'cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630  dev.zip' | sha256sum -c -
          mkdir -p bird/unpacked bird/databases
          unzip -q dev.zip -d bird/unpacked
          DB_ZIP=$(find bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)
          test -n "$DB_ZIP"
          unzip -q "$DB_ZIP" -d bird/databases
          DB_ROOT=$(find bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)
          if [ -z "$DB_ROOT" ]; then DB_ROOT=bird/databases; fi
          echo "DB_ROOT=$PWD/$DB_ROOT" >> "$GITHUB_ENV"
      - name: Start pinned original Qwen3.5-9B, no SQL training
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          ollama pull qwen3.5:9b-q4_K_M
      - name: Real original Qwen Guarded vs native batched SQLite read-only tool trials
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python -m evaluation.qwen_tools_bird12 \
            --source dev.json \
            --original runs/bird-paired-dev-v5/paired.json \
            --frozen fresh-native-batched-bird12-manifest.json \
            --database-root "$DB_ROOT" \
            --shard "$SHARD" \
            --output "native-batched-bird12-shard-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-batched-bird12-shard-${{ matrix.shard }}
          path: native-batched-bird12-shard-*.json
          if-no-files-found: warn
  aggregate:
    needs: paired
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-batched-bird12-shard-*
          merge-multiple: true
          path: shards
      - name: Report strict set and bag EX, new source IDs, model/trial calls and regression
        run: |
          python -m evaluation.qwen_tools_bird12 \
            --inputs shards/native-batched-bird12-shard-0.json \
                     shards/native-batched-bird12-shard-1.json \
                     shards/native-batched-bird12-shard-2.json \
            --output native-batched-bird12-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-native-batched-real-sql-fresh-bird12-final
          path: native-batched-bird12-final.json
          if-no-files-found: error
