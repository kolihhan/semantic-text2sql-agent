name: XiYan CGSR frozen-100 ablation

on:
  workflow_dispatch:
  push:
    paths:
      - .github/CGSR_FROZEN100_TRIGGER

permissions:
  contents: read

jobs:
  treatment:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr

      - name: Start Ollama and pull XiYanSQL 7B
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull hf.co/wanhin/XiYanSQL-QwenCoder-7B-2504-gguf:Q4_K_M

      - name: Download pinned BIRD 2024-06-27 dev release
        run: |
          mkdir -p /tmp/bird
          curl -fL --retry 3 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          DEV_JSON=$(find /tmp/bird/unpacked -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)
          DB_ZIP=$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)
          test -n "$DEV_JSON"
          test -n "$DB_ZIP"
          mkdir -p /tmp/bird/databases
          unzip -q "$DB_ZIP" -d /tmp/bird/databases
          DB_ROOT=$(find /tmp/bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)
          if [ -z "$DB_ROOT" ]; then DB_ROOT=/tmp/bird/databases; fi
          echo "DEV_JSON=$DEV_JSON" >> "$GITHUB_ENV"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"

      - name: Run paired XiYan vs CGSR shard
        run: |
          python experiments/xiyan_cgsr_frozen100.py \
            --source "$DEV_JSON" \
            --database-root "$DB_ROOT" \
            --frozen runs/bird-paired-dev-v4/paired.json \
            --model hf.co/wanhin/XiYanSQL-QwenCoder-7B-2504-gguf:Q4_K_M \
            --shard-index ${{ matrix.shard }} \
            --num-shards 4 \
            --output xiyan-cgsr-shard-${{ matrix.shard }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xiyan-cgsr-shard-${{ matrix.shard }}
          path: xiyan-cgsr-shard-${{ matrix.shard }}.json
          if-no-files-found: warn

  aggregate:
    needs: treatment
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xiyan-cgsr-shard-*
          path: shards
          merge-multiple: true

      - name: Aggregate paired results
        run: |
          python - <<'PY'
          import glob, json
          from collections import Counter
          from statistics import median

          rows = []
          for path in sorted(glob.glob('shards/xiyan-cgsr-shard-*.json')):
              with open(path, encoding='utf-8') as f:
                  rows.extend(json.load(f)['cases'])
          assert len(rows) == 100, len(rows)
          assert len({r['case_id'] for r in rows}) == 100

          direct_correct = sum(bool(r['xiyan_official_ex']) for r in rows)
          cgsr_correct = sum(bool(r['cgsr_official_ex']) for r in rows)
          direct_exec = sum(bool(r['xiyan_execution_success']) for r in rows)
          cgsr_exec = sum(bool(r['cgsr_execution_success']) for r in rows)
          wrong_to_correct = sum((not r['xiyan_official_ex']) and r['cgsr_official_ex'] for r in rows)
          correct_to_wrong = sum(r['xiyan_official_ex'] and (not r['cgsr_official_ex']) for r in rows)
          changed_sql = sum((r.get('cgsr_sql') or '') != (r.get('xiyan_sql') or '') for r in rows)
          issue_counts = Counter((r.get('cgsr_issue') or 'NO_REVISION').split(':', 1)[0] for r in rows)
          revision_latencies = [float(r['cgsr_revision_latency_s']) for r in rows]

          payload = {
              'experiment': 'XiYan direct vs XiYan + clause-guided semantic revision',
              'sample_size': 100,
              'model': 'hf.co/wanhin/XiYanSQL-QwenCoder-7B-2504-gguf:Q4_K_M',
              'gold_visible_to_model': False,
              'max_repairs': 0,
              'direct': {
                  'official_ex': direct_correct / 100,
                  'execution_success': direct_exec / 100,
                  'correct': direct_correct,
              },
              'xiyan_plus_cgsr': {
                  'official_ex': cgsr_correct / 100,
                  'execution_success': cgsr_exec / 100,
                  'correct': cgsr_correct,
                  'changed_sql': changed_sql,
                  'revision_latency_median_s': median(revision_latencies),
              },
              'transitions': {
                  'wrong_to_correct': wrong_to_correct,
                  'correct_to_wrong': correct_to_wrong,
                  'net_correct_delta': cgsr_correct - direct_correct,
              },
              'semantic_issue_counts': dict(sorted(issue_counts.items())),
              'cases': sorted(rows, key=lambda r: int(r['case_id'])),
          }
          with open('xiyan-cgsr-frozen100.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, indent=2, ensure_ascii=False)
          print(json.dumps({k: v for k, v in payload.items() if k != 'cases'}, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xiyan-cgsr-frozen100
          path: xiyan-cgsr-frozen100.json
