name: OVH Qwen3.5-9B BIRD frozen-six diagnostic (exposed DEV only)

on:
  workflow_dispatch:
  push:
    branches:
      - research/freellmapi-transport-probe-20261122
    paths:
      - .github/workflows/freellmapi-bird-six.yml
      - scripts/freellmapi_bird_six_probe.py

permissions:
  contents: read

jobs:
  frozen-six-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_HF_COMMIT: 3c11fb193e5439b338e23677fa0aae11e8b85db9
      SOURCE_RAW_SHA256: ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb
      SOURCE_HISTORICAL_SHA256: 0310b7ca2dfb6247234e2073f93e7a75106ee41ba55231f75d06d2ef68efe2ec
      DB_ZIP_SHA256: cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python research harness
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q scripts/freellmapi_bird_six_probe.py
      - name: Download and verify immutable exposed BIRD DEV source
        run: |
          set -euo pipefail
          mkdir -p .pilot
          curl -fLsS --retry 3 "https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/${SOURCE_HF_COMMIT}/data/dev_20251106-00000-of-00001.json?download=true" -o .pilot/source-lf.json
          echo "${SOURCE_RAW_SHA256}  .pilot/source-lf.json" | sha256sum -c -
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          p = Path('.pilot/source-lf.json').read_bytes()
          assert b'\r\n' not in p
          target = p.replace(b'\n', b'\r\n')
          Path('.pilot/source-historical.json').write_bytes(target)
          assert hashlib.sha256(target).hexdigest() == os.environ['SOURCE_HISTORICAL_SHA256']
          PY
      - name: Download and verify historical BIRD DEV physical databases
        run: |
          set -euo pipefail
          mkdir -p /tmp/bird
          curl -fL --retry 3 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "${DB_ZIP_SHA256}  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          NESTED="$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n 1)"
          test -n "$NESTED"
          mkdir -p /tmp/bird/databases
          unzip -q "$NESTED" -d /tmp/bird/databases
          DB_ROOT="$(find /tmp/bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n 1)"
          if [ -z "$DB_ROOT" ]; then DB_ROOT=/tmp/bird/databases; fi
          test -d "$DB_ROOT"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
          echo "DB_FILES=$(find "$DB_ROOT" -type f -name '*.sqlite' | wc -l)"
      - name: Install pinned open-source FreeLLMAPI
        run: |
          set -euo pipefail
          git clone -q https://github.com/tashfeenahmed/freellmapi.git /tmp/freellmapi
          git -C /tmp/freellmapi checkout -q --detach 7ad9097fd9d83bc3e1af0f925ea813a913b18dde
          cd /tmp/freellmapi
          npm ci --no-audit --no-fund
          npm run build:server
      - name: Start anonymous-only local FreeLLMAPI
        run: |
          set -euo pipefail
          cd /tmp/freellmapi
          export ENCRYPTION_KEY="$(openssl rand -hex 32)"
          export HOST=127.0.0.1 PORT=3001
          nohup node server/dist/index.js > /tmp/freellmapi-pilot.log 2>&1 < /dev/null &
          for i in $(seq 1 45); do
            if curl -fsS --max-time 2 http://127.0.0.1:3001/api/ping > /dev/null; then
              echo "ANONYMOUS_GATEWAY_BOOT_OK"
              exit 0
            fi
            sleep 2
          done
          echo "ANONYMOUS_GATEWAY_BOOT_FAILED"
          exit 1
      - name: Run preregistered 6-case direct-vs-guarded EX pilot
        run: |
          python -u -m scripts.freellmapi_bird_six_probe --source .pilot/source-historical.json --database-root "$DB_ROOT" --output-dir .pilot/results
      - name: Preserve incomplete as well as completed result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ovh-qwen35-frozen-six-dev-diagnostic
          path: .pilot/results/
          if-no-files-found: ignore
          retention-days: 30
