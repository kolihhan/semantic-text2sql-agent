name: Original Qwen3.5-9B BIRD TRAIN242 to VAL64 Evidence-SQL contract gate (NO MODEL)
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
  actions: read
jobs:
  frozen-evidence-sql-source-gate:
    if: github.head_ref == 'research/birdtrain-evidence-sql-contract-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Verify frozen label-blind contract code prior to reading real validation output
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:evaluation/evidence_sql_contract.py)" = "4f05916216266fb634ca6ce9502750875559ec51"
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_evidence_sql_contract.py tests/test_audit_birdtrain_evidence_sql_contract.py
      - name: Original immutable BIRD publisher TRAIN242 and disjoint TRAIN-VAL64 prompts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43888747753
          github-token: ${{ github.token }}
          name: qwen9b-birdtrain-db-disjoint-original-sql-sft-candidates
          path: original-source
      - name: ORIGINAL Qwen3.5-9B physical results on 4 separate TRAIN-VAL databases
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43892823922
          github-token: ${{ github.token }}
          name: original-qwen9b-birdtrain-val64-complete
          path: original-model
      - name: Audit publisher safety and independent real-model error discrimination
        run: |
          set -euo pipefail
          python -m scripts.audit_birdtrain_evidence_sql_contract \
            --train original-source/train.jsonl \
            --validation original-source/validation.jsonl \
            --model original-model/original-qwen9b-validation64-summary.json \
            --out original-birdtrain242-val64-evidence-sql-contract.json
          python - <<'PY'
          import json
          d=json.load(open('original-birdtrain242-val64-evidence-sql-contract.json'))
          assert d['status']=='ORIGINAL_QWEN_TRAIN242_TO_PHYSICAL_VAL64_EVIDENCE_CONTRACT_SCREEN_COMPLETE'
          assert d['original_publisher_train242']['n']==242
          assert d['original_Qwen9B_physical_val64']['real_original_Qwen_n']==64
          assert d['new_qwen_inference_calls']==0
          assert d['new_GPU_training_steps']==0
          assert d['fixed_base_model_Qwen_3_5_9B']
          assert not d['DEV500_used'] and not d['HOLDOUT300_used']
          print('FROZEN_EVIDENCE_CONTRACT_GATE',
                json.dumps({
                    'train': {k:v for k,v in d['original_publisher_train242'].items()
                              if k!='reference_violation_source_indices'},
                    'val': {k:v for k,v in d['original_Qwen9B_physical_val64'].items()
                            if k!='selection_diagnostic_case_ids'}
                },sort_keys=True),flush=True)
          PY
      - name: Preserve source-only original model evidence, no reference SQL attached
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-Qwen9B-TRAIN242-disjoint-VAL64-evidence-contract-gate
          path: original-birdtrain242-val64-evidence-sql-contract.json
          if-no-files-found: warn
          retention-days: 30
