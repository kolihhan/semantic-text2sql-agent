name: BIRD cross-backbone SQL candidate diversity XiYan vs Qwen Coder (CPU)

on:
  workflow_dispatch:
  push:
    branches: [experiment/bird-diverse-backbone-20261113]
    paths:
      - .github/BIRD_DIVERSE_BACKBONE_START

permissions:
  contents: read
  actions: read

env:
  MODEL: qwen2.5-coder:7b-instruct-q4_K_M

jobs:
  treatment:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout independent cross-backbone code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SQL project and SQLGlot
        run: python -m pip install -e ".[dev]"
      - name: Test gold-blind baseline and paired cross-backbone oracle
        run: python -m pytest -q tests/test_bird_diverse_backbone.py
      - name: Download and blind old BIRD100 XiYan baseline, discard labels and A1 alternatives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 43372535238
          repository: kolihhan/semantic-text2sql-agent
          github-token: ${{ github.token }}
          name: bird-coder-diversity-paired100
          path: /tmp/previous
      - name: Strip old gold-linked metrics and unrelated candidate before model generation
        run: |
          set -euo pipefail
          python -m experiments.bird_diverse_backbone \
            --baseline-source /tmp/previous/bird-coder-diversity-paired100.json \
            --blind-output /tmp/xiyan-blind-only.json
          python - <<'PY'
          import json
          r=json.load(open("/tmp/xiyan-blind-only.json"))
          assert r["schema"]=="bird-diverse-backbone-blind-baseline-v1"
          assert len(r["cases"])==100
          assert all(set(x)=={"case_id","database_id","xiyan_a0_sql"} for x in r["cases"])
          print("HISTORIC_GOLD_REMOVED")
          PY
          rm -rf /tmp/previous
      - name: Install CPU Ollama and independent Qwen2.5-Coder 7B model
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull "$MODEL"
      - name: Fetch checksum-pinned BIRD DEV and SQLite databases
        run: |
          set -euo pipefail
          mkdir -p /tmp/bird
          curl -fL --retry 4 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          DEV_JSON="$(find /tmp/bird/unpacked -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)"
          DB_ZIP="$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)"
          test -f "$DEV_JSON" && test -f "$DB_ZIP"
          mkdir -p /tmp/bird/databases
          unzip -q "$DB_ZIP" -d /tmp/bird/databases
          DB_ROOT="$(find /tmp/bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)"
          if [ -z "$DB_ROOT" ]; then DB_ROOT=/tmp/bird/databases; fi
          test -d "$DB_ROOT"
          echo "DEV_JSON=$DEV_JSON" >> "$GITHUB_ENV"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
      - name: Generate one distinct Coder7B SQL per frozen XiYan100 question before gold scoring
        shell: bash
        run: |
          set -euo pipefail
          python -m experiments.bird_diverse_backbone \
            --source "$DEV_JSON" \
            --database-root "$DB_ROOT" \
            --blinded-baseline /tmp/xiyan-blind-only.json \
            --model "$MODEL" \
            --shard-index "${{ matrix.shard }}" \
            --output "coder-shard-${{ matrix.shard }}.json"
      - name: Upload frozen per-shard paired results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coder-diversity-shard-${{ matrix.shard }}
          path: coder-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: treatment
    if: ${{ always() && needs.treatment.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coder-diversity-shard-*
          path: shards
          merge-multiple: true
      - name: Aggregate XiYan-vs-Coder100 paired results and cross-model oracle headroom
        run: |
          set -euo pipefail
          python -m experiments.bird_diverse_backbone \
            --inputs shards/coder-shard-0.json shards/coder-shard-1.json shards/coder-shard-2.json shards/coder-shard-3.json \
            --output bird-coder-diversity-paired100.json
          python - <<'PY'
          import json
          p=json.load(open('bird-coder-diversity-paired100.json'))
          assert p['count']==100
          assert p['xiyan_correct']==64\n          assert p['automatic_selector_ran'] is False
          assert len({c['case_id'] for c in p['cases']}) == 100
          print('BIRD_DIVERSE_BACKBONE', json.dumps({k:v for k,v in p.items() if k!='cases'},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bird-coder-diversity-paired100
          path: bird-coder-diversity-paired100.json
          if-no-files-found: error
          retention-days: 30
