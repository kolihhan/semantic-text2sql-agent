name: Colab credential compatibility probe (no GPU)
on:
  push:
    branches:
      - research/verified-teacher-trajectory-v0-20261112
      - research/semantic-sft-colab-20261112
    paths:
      - '.github/workflows/colab-credential-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      COLAB_TOKEN: ${{ secrets.COLAB_TOKEN }}
      COLAB_CLI_TOKEN: ${{ secrets.COLAB_CLI_TOKEN }}
      GOOGLE_COLAB_TOKEN: ${{ secrets.GOOGLE_COLAB_TOKEN }}
      COLAB_ACCESS_TOKEN: ${{ secrets.COLAB_ACCESS_TOKEN }}
      COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
      COLAB_OAUTH_JSON: ${{ secrets.COLAB_OAUTH_JSON }}
      COLAB_AUTH_JSON: ${{ secrets.COLAB_AUTH_JSON }}
      COLAB_CREDENTIALS_JSON: ${{ secrets.COLAB_CREDENTIALS_JSON }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      GOOGLE_COLAB_CREDENTIALS: ${{ secrets.GOOGLE_COLAB_CREDENTIALS }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Validate credential shape without revealing any secret
        id: check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,pathlib
          names=("COLAB_ADC_JSON","COLAB_OAUTH_JSON","COLAB_AUTH_JSON","COLAB_CREDENTIALS_JSON",
                 "GOOGLE_APPLICATION_CREDENTIALS_JSON","GOOGLE_CREDENTIALS_JSON","GOOGLE_COLAB_CREDENTIALS",
                 "COLAB_TOKEN","COLAB_CLI_TOKEN","GOOGLE_COLAB_TOKEN","COLAB_ACCESS_TOKEN")
          valid=[]
          malformed=[]
          raw=[]
          for name in names:
              value=os.environ.get(name,"").strip()
              if not value: continue
              try:
                  doc=json.loads(value)
              except (json.JSONDecodeError,ValueError):
                  raw.append(name); continue
              if not isinstance(doc,dict):
                  malformed.append(name); continue
              if doc.get("type")=="authorized_user" and all(doc.get(k) for k in ("client_id","client_secret","refresh_token")):
                  valid.append((name,doc)); continue
              if doc.get("type")=="service_account" and all(doc.get(k) for k in ("client_email","private_key")):
                  valid.append((name,doc)); continue
              if doc.get("refresh_token") and doc.get("client_id") and doc.get("client_secret"):
                  valid.append((name,{**doc,"type":"authorized_user"})); continue
              malformed.append(name)
          print("COLAB_CREDENTIAL_PROBE",json.dumps({
              "candidate_secrets_present":len(valid)+len(malformed)+len(raw),
              "adc_compatible_count":len(valid),
              "raw_token_count":len(raw),
              "other_json_count":len(malformed),
              "hf_token_present":bool(os.environ.get("HF_TOKEN")),
              "gpu_requested":False,
          },sort_keys=True))
          if valid:
              name,obj=valid[0]
              p=pathlib.Path(os.environ["RUNNER_TEMP"])/"colab-adc.json"
              p.write_text(json.dumps(obj),encoding="utf-8")
              p.chmod(0o600)
              with open(os.environ["GITHUB_ENV"],"a") as f:
                  f.write("GOOGLE_APPLICATION_CREDENTIALS="+str(p)+"\n")
                  f.write("COLAB_ADC_AVAILABLE=1\n")
          else:
              with open(os.environ["GITHUB_ENV"],"a") as f:
                  f.write("COLAB_ADC_AVAILABLE=0\n")
          PY
      - name: Diagnose Google OAuth refresh privately (never print token or grant)
        if: env.COLAB_ADC_AVAILABLE == '1'
        shell: bash
        run: |
          python -m pip install --quiet 'google-auth>=2.20'
          python - <<'PY'
          import json,os
          import google.auth
          from google.auth.transport.requests import Request
          p=os.environ["GOOGLE_APPLICATION_CREDENTIALS"]
          doc=json.load(open(p))
          scopes=[
              "openid",
              "https://www.googleapis.com/auth/userinfo.email",
              "https://www.googleapis.com/auth/cloud-platform",
              "https://www.googleapis.com/auth/colaboratory",
              "https://www.googleapis.com/auth/drive.file",
          ]
          kind=doc.get("type")
          included=doc.get("scopes",[])
          if isinstance(included,str):
              included=included.split()
          findings={"credential_type":kind,
             "declared_colab_scope":bool("https://www.googleapis.com/auth/colaboratory" in included),
             "declared_scope_count":len(included)}
          try:
              cred,_=google.auth.load_credentials_from_file(p,scopes=scopes)
              cred.refresh(Request())
              findings["refresh"]="success"
              findings["valid"]=bool(cred.valid)
          except Exception as exc:
              message=str(exc).lower()
              words=("invalid_grant","invalid_scope","unauthorized_client","invalid_client",
                     "invalid_rapt","access_denied","insufficient_scope","expired","quota")
              findings["refresh"]="failed"
              findings["category"]=next((w for w in words if w in message),"other")
              findings["error_class"]=type(exc).__name__
          print("COLAB_OAUTH_DIAGNOSTIC",json.dumps(findings,sort_keys=True))
          PY
      - name: Validate Colab CLI session auth, no GPU allocation
        if: env.COLAB_ADC_AVAILABLE == '1'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'google-colab-cli==0.8.0'
          timeout 100 colab --auth=adc usage
      - name: Record credential capability conclusion
        if: always()
        run: |
          if [ "${COLAB_ADC_AVAILABLE:-0}" = "1" ]; then
            echo "ADC-compatible credential was found; check previous step for API authorization."
          else
            echo "No Google ADC-compatible Colab credential was found in checked repository secrets; raw provider tokens cannot directly authenticate official Colab CLI."
          fi
