  qwen9b_dev500_k8_full_aggregate:
    needs: qwen9b_dev500_k8_rest30
    if: github.event_name == 'pull_request' && github.head_ref == 'research/frozen-dev500-qwen9b-kcache-offline-selectors-20261117' && needs.qwen9b_dev500_k8_rest30.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install original model-free cache and selector modules
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_kcache_protocol.py
      - name: Download EXACT original first two immutable K8 shards from completed earlier physical Actions run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 44086713331
          github-token: ${{ github.token }}
          pattern: k8-bird-dev500-prospective-cache-and-offline-score-shard-*
          path: all-shards
          merge-multiple: true
      - name: Download 30 new immutable candidate caches and offline scored artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: k8-bird-dev500-prospective-cache-and-offline-score-shard-*
          path: all-shards
          merge-multiple: true
      - name: Verify all 500 frozen cases and exactly 4000 original Qwen K8 calls without gold in cached candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,glob
          from pathlib import Path
          from evaluation.kcache_protocol import read_frozen_manifest
          from evaluation.qwen9b_kcache import validate_cache
          m=read_frozen_manifest(Path('manifests/bird-dev500-holdout300-20261116-v2.json'))
          files=sorted(glob.glob('all-shards/k8-dev500-candidate-cache-*.json'))
          scored=sorted(glob.glob('all-shards/k8-dev500-offline-scored-*.json'))
          assert len(files)==len(scored)==32,(len(files),len(scored))
          seen=[]
          calls=0
          for path in files:
              x=json.load(open(path))
              assert x['k']==8 and x['no_gold_sql_in_cache'] and x['no_repair']
              assert x['model_digest']=='56671c2ab9385f9cfcb404638e32cd62d88e3501d44822208363c010179a3c90'
              assert len(x['cases']) in (15,16)
              for case in x['cases']:
                  assert len(case['samples'])==8
                  assert [s['index'] for s in case['samples']]==list(range(8))
                  calls+=8
                  seen.append(case['case_id'])
          assert len(seen)==500 and len(set(seen))==500
          assert set(seen)==set(m['dev_case_ids'])
          assert calls==4000
          print('BIRD_DEV500_ALL_ORIGINAL_QWEN_K8_CACHED',len(seen),calls)
          PY
      - name: Model-free strict complete-500 pass-at-K and gold-blind selector, paired question and DB CIs
        shell: bash
        run: |
          set -euo pipefail
          python -m evaluation.qwen9b_kcache aggregate \
            --inputs all-shards/k8-dev500-offline-scored-*.json \
            --out k8-dev500-original-qwen-complete.json
          python - <<'PY'
          import json
          x=json.load(open('k8-dev500-original-qwen-complete.json'))
          assert x['status']=='COMPLETE_FROZEN_DEV500_KCACHE_OFFLINE_ANALYSIS'
          assert x['results']['n']==500 and x['results']['k']==8
          assert x['holdout300_used'] is False
          print('OFFICIAL_SOURCE_DEV500_PASSATK_K8',json.dumps(x['results'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen9b-original-BIRD-DEV500-K8-fully-verified-only
          path: k8-dev500-original-qwen-complete.json
          if-no-files-found: warn
          retention-days: 30
