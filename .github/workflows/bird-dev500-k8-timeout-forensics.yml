name: BIRD DEV500 shard7 SQLite timeout forensic (NO QWEN)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  bounded-shard7-only:
    if: github.head_ref == 'research/bird-dev500-k8-salvage-shard7-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Test the original evaluator's isolated per-query timeout behavior
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_bounded_shard7_probe.py tests/test_kcache_protocol.py
      - name: Download original immutable candidate cache shard 7 ONLY
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 44093103960
          github-token: ${{ github.token }}
          name: k8-bird-dev500-prospective-cache-and-offline-score-shard-7
          path: cache
      - name: Verify source/model and exact K8 shard seven cache
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from evaluation.kcache_protocol import read_frozen_manifest, candidate_seed
          from evaluation.qwen9b_kcache import source_shard
          p=Path('cache/k8-dev500-candidate-cache-7.json')
          assert p.is_file()
          x=json.loads(p.read_text())
          manifest=read_frozen_manifest(Path('manifests/bird-dev500-holdout300-20261116-v2.json'))
          expected=source_shard(manifest['dev_case_ids'],7,32)
          assert x['status']=='CANDIDATE_CACHE_COMPLETE'
          assert (x['shard'],x['shards'],x['k'])==(7,32,8)
          assert x['model_digest']=='56671c2ab9385f9cfcb404638e32cd62d88e3501d44822208363c010179a3c90'
          assert x['no_gold_sql_in_cache'] and x['no_repair']
          assert len(x['cases'])==16
          assert [q['case_id'] for q in x['cases']]==expected
          assert all(
            all(s['index']==i and s['seed']==candidate_seed(q['case_id'],i)
                for i,s in enumerate(q['samples']))
            for q in x['cases'])
          print('SHARD7_ORIGINAL_CACHE_VALID',len(x['cases']),128,flush=True)
          PY
      - name: Download pinned original BIRD DEV questions (no new model calls)
        run: |
          set -euo pipefail
          mkdir -p /tmp/bird
          curl -fsSL --retry 5 \
            'https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/3c11fb193e5439b338e23677fa0aae11e8b85db9/data/dev_20251106-00000-of-00001.json?download=true' \
            -o /tmp/bird/bird-dev-original.json
          echo 'ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb  /tmp/bird/bird-dev-original.json' | sha256sum -c -
      - name: Download SHA-pinned original BIRD DEV physical SQLite files
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 \
            'https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip' \
            -o /tmp/bird/dev.zip
          echo 'cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630  /tmp/bird/dev.zip' | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          original=$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)
          test -n "$original"
          mkdir -p /tmp/bird/dbfiles
          unzip -q "$original" -d /tmp/bird/dbfiles
          root=$(find /tmp/bird/dbfiles -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)
          if [ -z "$root" ]; then root=/tmp/bird/dbfiles; fi
          test -d "$root"
          echo "DB_ROOT=$root" >> "$GITHUB_ENV"
      - name: Bound 8 original candidate SQL plus reference separately; never truncate silently
        run: |
          set -euo pipefail
          python -m evaluation.bounded_shard7_probe \
            --source /tmp/bird/bird-dev-original.json \
            --db-root "$DB_ROOT" \
            --manifest manifests/bird-dev500-holdout300-20261116-v2.json \
            --cache cache/k8-dev500-candidate-cache-7.json \
            --per-query-seconds 8 \
            --out bounded-shard7-diagnostic.json
          python - <<'PY'
          import json
          x=json.load(open('bounded-shard7-diagnostic.json'))
          assert x['model_calls']==0 and x['selector_never_sees_gold']
          assert x['shard']==7 and len(x['cases'])==16
          print('SHARD7_TIMEOUT_FORENSIC',x['status'],
                'timedout_candidates',x['candidate_timeouts'],
                'timedout_gold',x['reference_timeouts'],flush=True)
          if x['status'] != 'SCORED_FROM_IMMUTABLE_CACHE_ONLY':
              print('WARNING: Cannot mix bounded/censored shard with unbounded source scorer for official DEV500')
          PY
      - name: Preserve source-only bounded diagnostic (never a promotion)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BIRD-DEV500-SHARD7-BOUNDED-SQLITE-DIAGNOSTIC-NOT-MAIN-EX
          path: bounded-shard7-diagnostic.json
          if-no-files-found: warn
          retention-days: 30
