name: Qwen3.5 9B paired frozen-100

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/QWEN9B_FROZEN100_TRIGGER"

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr

      - name: Start Ollama and pull Qwen3.5 9B
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull qwen3.5:9b-q4_K_M
          ollama list

      - name: Download pinned BIRD 2024-06-27 dev release
        run: |
          mkdir -p /tmp/bird
          curl -fL --retry 3 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          DEV_JSON=$(find /tmp/bird/unpacked -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)
          DB_ZIP=$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)
          test -n "$DEV_JSON"
          test -n "$DB_ZIP"
          mkdir -p /tmp/bird/databases
          unzip -q "$DB_ZIP" -d /tmp/bird/databases
          DB_ROOT=$(find /tmp/bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)
          if [ -z "$DB_ROOT" ]; then DB_ROOT=/tmp/bird/databases; fi
          echo "DEV_JSON=$DEV_JSON" >> "$GITHUB_ENV"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"

      - name: Build exact frozen shard manifest
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          frozen = json.loads(Path("runs/bird-paired-dev-v5/paired.json").read_text(encoding="utf-8"))
          assert frozen["status"] == "complete"
          assert frozen["sample_size"] == 100
          frozen_rows = frozen["cases"]
          ids = [str(row["case_id"]) for row in frozen_rows]
          assert len(ids) == 100 and len(set(ids)) == 100

          # Match the XiYan workflow pattern: the frozen artifact defines the
          # case IDs, while the pinned BIRD download is the source used now.
          dev_path = Path(os.environ["DEV_JSON"])
          dev_rows = json.loads(dev_path.read_text(encoding="utf-8"))
          dev_by_id = {
              str(row.get("question_id") or row.get("id") or i): row
              for i, row in enumerate(dev_rows)
          }
          frozen_by_id = {str(row["case_id"]): row for row in frozen_rows}

          missing = [case_id for case_id in ids if case_id not in dev_by_id]
          assert not missing, missing
          mismatches = []
          for case_id in ids:
              old = frozen_by_id[case_id]
              new = dev_by_id[case_id]
              if str(new["db_id"]) != str(old["database_id"]) or str(new["question"]) != str(old["question"]):
                  mismatches.append(case_id)
          assert not mismatches, f"frozen case identity mismatch: {mismatches[:10]}"

          shard = int(os.environ["SHARD"])
          selected = [case_id for i, case_id in enumerate(ids) if i % 4 == shard]
          assert len(selected) == 25

          actual_source_sha = hashlib.sha256(dev_path.read_bytes()).hexdigest()
          manifest = {
              "protocol_version": 1,
              "source_sha256": actual_source_sha,
              "seed": f"qwen9b-frozen100-shard-{shard}",
              "dev_case_ids": selected,
              "final_case_ids": [],
          }
          Path(f"/tmp/qwen9b-shard-{shard}.json").write_text(
              json.dumps(manifest, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "shard": shard,
              "count": len(selected),
              "source_sha256": actual_source_sha,
              "frozen_reference_sha256": frozen["source_sha256"],
              "case_ids": selected,
          }, indent=2))
          PY

      - name: Run paired Direct vs Guarded shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python -m evaluation.run_bird paired-dev \
            --source "$DEV_JSON" \
            --database-root "$DB_ROOT" \
            --manifest "/tmp/qwen9b-shard-${SHARD}.json" \
            --model qwen3.5:9b-q4_K_M \
            --timeout 600 \
            --max-rows 50000 \
            --output "qwen9b-paired-shard-${SHARD}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen9b-paired-shard-${{ matrix.shard }}
          path: qwen9b-paired-shard-${{ matrix.shard }}.json
          if-no-files-found: warn

  aggregate:
    needs: benchmark
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@v4
        with:
          pattern: qwen9b-paired-shard-*
          path: shards
          merge-multiple: true

      - name: Aggregate and verify exact frozen-100 result
        run: |
          python - <<'PY'
          import glob
          import json
          from pathlib import Path
          from statistics import median

          shard_paths = sorted(glob.glob("shards/qwen9b-paired-shard-*.json"))
          assert len(shard_paths) == 4, shard_paths

          payloads = [json.loads(Path(p).read_text(encoding="utf-8")) for p in shard_paths]
          assert all(p["status"] == "complete" for p in payloads)
          assert all(p["model"] == "qwen3.5:9b-q4_K_M" for p in payloads)
          digests = {p["model_digest"] for p in payloads}
          assert len(digests) == 1, digests
          source_hashes = {p["source_sha256"] for p in payloads}
          assert len(source_hashes) == 1, source_hashes

          cases = [case for payload in payloads for case in payload["cases"]]
          assert len(cases) == 100
          case_ids = [str(case["case_id"]) for case in cases]
          assert len(set(case_ids)) == 100

          frozen = json.loads(Path("runs/bird-paired-dev-v5/paired.json").read_text(encoding="utf-8"))
          frozen_ids = [str(case["case_id"]) for case in frozen["cases"]]
          assert set(case_ids) == set(frozen_ids)
          assert all(case.get("initial_sql_identical") is True for case in cases)

          def p95(values):
              values = sorted(values)
              return values[max(0, int(0.95 * len(values) + 0.999999) - 1)]

          def arm_metrics(arm):
              rows = [case[arm] for case in cases]
              latencies = [float(row["latency_s"]) for row in rows]
              return {
                  "official_bird_ex": sum(bool(row["official_ex"]) for row in rows) / len(rows),
                  "execution_success": sum(bool(row["execution_success"]) for row in rows) / len(rows),
                  "model_calls": sum(int(row["model_calls"]) for row in rows),
                  "latency_median_s": median(latencies),
                  "latency_p95_s": p95(latencies),
              }

          transitions = {
              "direct_wrong_to_guarded_correct": sum(
                  (not case["direct"]["official_ex"]) and case["guarded"]["official_ex"] for case in cases
              ),
              "direct_correct_to_guarded_wrong": sum(
                  case["direct"]["official_ex"] and (not case["guarded"]["official_ex"]) for case in cases
              ),
              "direct_execution_fail_to_guarded_success": sum(
                  (not case["direct"]["execution_success"]) and case["guarded"]["execution_success"] for case in cases
              ),
              "direct_execution_success_to_guarded_fail": sum(
                  case["direct"]["execution_success"] and (not case["guarded"]["execution_success"]) for case in cases
              ),
          }

          result = {
              "project": "P1 Benchmark-First Text-to-SQL",
              "experiment": "Qwen3.5 9B paired Direct vs Guarded on exact frozen-100 BIRD DEV case IDs",
              "status": "complete",
              "model": "qwen3.5:9b-q4_K_M",
              "model_digest": next(iter(digests)),
              "sample_size": 100,
              "frozen_reference": "runs/bird-paired-dev-v5/paired.json",
              "source_sha256": next(iter(source_hashes)),
              "frozen_reference_source_sha256": frozen["source_sha256"],
              "runtime": {
                  "think": False,
                  "max_repairs": 2,
                  "max_rows": 50000,
                  "guarded_treatment": payloads[0]["runtime"]["guarded_treatment"],
                  "schema_grounding": payloads[0]["runtime"]["schema_grounding"],
              },
              "official_bird_evaluator": payloads[0]["official_bird_evaluator"],
              "metrics": {
                  "direct": arm_metrics("direct"),
                  "guarded": arm_metrics("guarded"),
                  "transitions": transitions,
              },
              "cases": sorted(cases, key=lambda row: frozen_ids.index(str(row["case_id"]))),
          }

          Path("qwen9b-paired-frozen100.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          print(json.dumps({k: v for k, v in result.items() if k != "cases"}, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qwen9b-paired-frozen100
          path: qwen9b-paired-frozen100.json
