name: Qwen9B physical SQL probe vs equal-inference control

on:
  push:
    branches: [experiment/qwen9b-physical-witness-20261115]
    paths: [.github/workflows/qwen9b-physical-witness.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        db: [chinook, sakila]
        shard: [0, 1]
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NUM_PARALLEL: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Restore pinned independent question and SQLite sources
        env:
          DATASET: ${{ matrix.db }}
        run: |
          python -m pip install -e .
          mkdir -p source/eval
          revision=d5420f1ad73c6608c1b2869d7fba662ea4709920
          for name in heldout.jsonl sakila_questions.jsonl; do
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/VinayakMokashi/text2sql-analyst/$revision/eval/$name" -o "source/eval/$name"
          done
          if [ "$DATASET" = chinook ]; then
            curl -fsSL --retry 3 'https://github.com/lerocha/chinook-database/releases/download/v1.4.5/Chinook_Sqlite.sqlite' -o benchmark.sqlite
            echo 'bdf635be69850bd3be09c9a2dbeef7ddfb80036bd3ef3381383cd03b61e4a61a  benchmark.sqlite' | sha256sum -c -
          else
            base=https://raw.githubusercontent.com/jOOQ/sakila/e089a5b1ec9af0df7a9c6a5d47d49fa1736a4e84/sqlite-sakila-db
            curl -fsSL --retry 3 "$base/sqlite-sakila-schema.sql" -o schema.sql
            curl -fsSL --retry 3 "$base/sqlite-sakila-insert-data.sql" -o data.sql
            python - <<'PY'
          import sqlite3
          from pathlib import Path
          con = sqlite3.connect("benchmark.sqlite")
          con.executescript(Path("schema.sql").read_text())
          con.executescript("BEGIN;\n" + Path("data.sql").read_text() + "\nCOMMIT;")
          con.executescript("DROP TABLE IF EXISTS film_text; VACUUM;")
          assert con.execute("PRAGMA quick_check").fetchone() == ("ok",)
          con.close()
          PY
          fi
      - name: Restore CPU Ollama and Qwen9B
        run: |
          curl -fsSL --retry 3 'https://ollama.com/download/ollama-linux-amd64.tar.zst' | sudo tar --zstd -x -C /usr
          ollama serve > "$RUNNER_TEMP/ollama-witness.log" 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:11434/api/tags > /dev/null 2>&1 && break
            sleep 1
          done
          ollama pull qwen3.5:9b-q4_K_M
      - name: Paired physical SQL generation and strict scoring
        env:
          DATASET: ${{ matrix.db }}
          SHARD: ${{ matrix.shard }}
        run: |
          python -m evaluation.qwen_sql_witness --source source/eval --db benchmark.sqlite --dataset "$DATASET" --shard "$SHARD" --output "witness-$DATASET-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: witness-${{ matrix.db }}-${{ matrix.shard }}
          path: witness-*.json
          if-no-files-found: error

  aggregate:
    needs: paired
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: witness-*
          path: shards
          merge-multiple: true
      - run: python -m evaluation.qwen_sql_witness --inputs shards/witness-*.json --output qwen-sql-witness-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-sql-witness-final
          path: qwen-sql-witness-final.json
          if-no-files-found: error
