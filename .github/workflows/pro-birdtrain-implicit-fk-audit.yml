name: PRO physical BIRD TRAIN FK None vs primary-key schema audit (CPU)

on:
  push:
    branches: [experiment/bird-implicit-fk-grounding-v1-20261117]
    paths:
      - evaluation/implicit_fk_grounding.py
      - tests/test_implicit_fk_grounding.py
      - scripts/audit_birdtrain_fk_schema.py
      - .github/workflows/pro-birdtrain-implicit-fk-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  physical-fk-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Deterministic simple/composite/existing/unresolved FK tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_implicit_fk_grounding.py tests/test_catalog_execution.py
      - name: Original frozen source BIRD TRAIN validation64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43888747753
          github-token: ${{ github.token }}
          name: qwen9b-birdtrain-db-disjoint-original-sql-sft-candidates
          path: inputs
      - name: Physical source SQLite SHA check and single-variable FK context audit
        run: |
          set -euo pipefail
          python -m scripts.audit_birdtrain_fk_schema \
            --validation inputs/validation.jsonl \
            --work physical-dbs \
            --output evidence/original-birdtrain-fk-schema-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-birdtrain-fk-schema-source-audit
          path: evidence/original-birdtrain-fk-schema-audit.json
          retention-days: 30
          if-no-files-found: error
