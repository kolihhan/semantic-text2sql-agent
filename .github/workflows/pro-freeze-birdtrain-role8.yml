name: PRO source-only BIRD TRAIN role-scoped value8 after 32 previously seen DBs

on:
  push:
    branches: [experiment/qwen9b-role-scoped-value-evidence-v1-20261117]
    paths:
      - scripts/freeze_birdtrain_role8.py
      - evaluation/role_scoped_grounding.py
      - .github/workflows/pro-freeze-birdtrain-role8.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  freeze-original-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Source and semantic guard regression tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_role_scoped_grounding.py
          python -m py_compile scripts/freeze_birdtrain_role8.py
          grep -Fq 'python -m scripts.freeze_birdtrain_role8' .github/workflows/pro-freeze-birdtrain-value16-replica.yml
      - name: Load SHA-checked original BIRD TRAIN and DEV exclusion IDs ONLY
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 https://huggingface.co/datasets/Emulated-Inc/text-to-sql-with-evidence-training-pool/resolve/cd2c4ea321075aa53ce7dfe52deaaffa505d046a/raw/bird/train.json -o train.json
          echo "cd5884489dffd7c76d73509b396bd919fbe8b486efbc4ba2f48f89460de7d69f  train.json" | sha256sum -c -
          curl -fsSL --retry 5 "https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/3c11fb193e5439b338e23677fa0aae11e8b85db9/data/dev_20251106-00000-of-00001.json?download=true" -o dev.json
          echo "ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb  dev.json" | sha256sum -c -
      - name: Retrieve 20 previously exposed physical DBs (16 SFT TRAIN and 4 VALIDATION)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43888747753
          github-token: ${{ github.token }}
          name: qwen9b-birdtrain-db-disjoint-original-sql-sft-candidates
          path: prior
      - name: Retrieve 4 previously exposed FK-treatment physical DBs, to exclude
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43904889296
          github-token: ${{ github.token }}
          name: qwen9b-fk-correction-prospective-source32-frozen
          path: prior-fk
      - name: Exclude first physical value16 study four DBs from this replication
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43920461939
          github-token: ${{ github.token }}
          name: qwen9b-newdb-physical-value16-source-freeze
          path: prior-value16
      - name: Exclude second failed source-value16 four DBs and original task IDs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 43926576493
          github-token: ${{ github.token }}
          name: qwen9b-third-newdb-role8-source-freeze
          path: prior-value16-replica
      - name: Freeze 8 new DB-disjoint role-matched source cases (NO Qwen inference)
        run: |
          set -euo pipefail
          python -m scripts.freeze_birdtrain_value16_replica \
            --train train.json --dev dev.json \
            --prior-train prior/train.jsonl \
            --prior-validation prior/validation.jsonl \
            --prior-fk32 prior-fk/prospective32.jsonl \
            --prior-value16 prior-value16/physical-value16.jsonl \
            --prior-value16-replica prior-value16-replica/physical-value16.jsonl \
            --db-work source-dbs \
            --out frozen-role8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen9b-second-newdb-physical-value16-source-freeze
          path: frozen-role8/
          retention-days: 30
          if-no-files-found: error
