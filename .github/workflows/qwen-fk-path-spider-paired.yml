name: Qwen9B source-only multi-hop FK relation route physical EX
on:
  push:
    branches: [experiment/fk-path-bridging-spider-source-shift-20261115]
    paths: [.github/workflows/qwen-fk-path-spider-paired.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  SPIDER_SHA256: 00636695dabed6b5f4b8328a16b13e069a2f16591d5efcce57660669c85b121b

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Gold-blind selection and nonregression unit tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_schema_fk_bridge.py
      - name: Restore source and preregister six physically untouched databases
        run: |
          set -euo pipefail
          mkdir -p /tmp/spider
          curl -fL --retry 4 --retry-delay 5 https://huggingface.co/datasets/HAL-9001/spider-databases/resolve/main/spider_data.zip -o /tmp/spider/source.zip
          echo "$SPIDER_SHA256  /tmp/spider/source.zip" | sha256sum -c -
          unzip -q /tmp/spider/source.zip -d /tmp/spider/extract
          TRAIN_JSON="$(find /tmp/spider/extract -type f -name train_spider.json ! -path '*/__MACOSX/*' | head -n1)"
          DEV_JSON="$(find /tmp/spider/extract -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)"
          DB_ROOT="$(dirname "$TRAIN_JSON")/database"
          python -m evaluation.qwen_fk_path_spider --train "$TRAIN_JSON" --dev "$DEV_JSON" --db-root "$DB_ROOT" --output spider-fkpath-frozen.json
          python - <<'PY'
          import json
          x=json.load(open("spider-fkpath-frozen.json"))
          assert x["count"]==12 and x["physical_dbs"]==6 and x["gold_blind"]
          assert all("query" not in c for c in x["cases"])
          print("FROZEN_DBS",sorted({c["db_id"] for c in x["cases"]}))
          print("COHORT_SHA",x["cohort_sha256"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-fkpath-source-cohort-frozen
          path: spider-fkpath-frozen.json
          if-no-files-found: error

  paired:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 175
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: '8192'
      OLLAMA_NUM_PARALLEL: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qwen-fkpath-source-cohort-frozen
      - name: Restore identical source, SHA verification
        run: |
          set -euo pipefail
          mkdir -p /tmp/spider
          curl -fL --retry 4 --retry-delay 5 https://huggingface.co/datasets/HAL-9001/spider-databases/resolve/main/spider_data.zip -o /tmp/spider/source.zip
          echo "$SPIDER_SHA256  /tmp/spider/source.zip" | sha256sum -c -
          unzip -q /tmp/spider/source.zip -d /tmp/spider/extract
          TRAIN_JSON="$(find /tmp/spider/extract -type f -name train_spider.json ! -path '*/__MACOSX/*' | head -n1)"
          DEV_JSON="$(find /tmp/spider/extract -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)"
          DB_ROOT="$(dirname "$TRAIN_JSON")/database"
          echo "TRAIN_JSON=$TRAIN_JSON" >> "$GITHUB_ENV"
          echo "DEV_JSON=$DEV_JSON" >> "$GITHUB_ENV"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
      - name: Start original Qwen3.5-9B on free GitHub CPU
        run: |
          curl -fsSL --retry 3 https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          ollama pull qwen3.5:9b-q4_K_M
      - name: Original Qwen9B Guarded vs source-only FK-bridge schema context; same budgets
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python -m evaluation.qwen_fk_path_spider --train "$TRAIN_JSON" --dev "$DEV_JSON" --db-root "$DB_ROOT" --manifest spider-fkpath-frozen.json --shard "$SHARD" --output "spider-fkpath-shard-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spider-fkpath-${{ matrix.shard }}
          path: spider-fkpath-shard-*.json
          if-no-files-found: warn

  aggregate:
    needs: paired
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: spider-fkpath-*
          path: shards
          merge-multiple: true
      - name: Matched strict set and bag physical execution match, costs, and regressions
        run: |
          python -m evaluation.qwen_fk_path_spider --inputs shards/spider-fkpath-shard-0.json shards/spider-fkpath-shard-1.json shards/spider-fkpath-shard-2.json --output spider-fkpath-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spider-fkpath-final
          path: spider-fkpath-final.json
          if-no-files-found: error
