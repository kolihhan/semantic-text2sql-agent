name: XiYan 7B M-Schema frozen100 vs lexical 58

on:
  workflow_dispatch:
  push:
    branches: [experiment/xiyan-mschema-20261112]
    paths: ['.github/XIYAN_MSCHEMA_TRIGGER']

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout treatment source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install evaluation code
        run: python -m pip install -e ".[dev]"
      - name: Download frozen BIRD databases
        run: |
          set -euo pipefail
          mkdir -p /tmp/preflight-bird
          curl -fL --retry 3 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/preflight-bird/dev.zip
          echo "cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630  /tmp/preflight-bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/preflight-bird/dev.zip -d /tmp/preflight-bird/unpacked
          DEV_JSON=$(find /tmp/preflight-bird/unpacked -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)
          DB_ZIP=$(find /tmp/preflight-bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)
          test -n "$DEV_JSON" && test -n "$DB_ZIP"
          mkdir -p /tmp/preflight-bird/databases
          unzip -q "$DB_ZIP" -d /tmp/preflight-bird/databases
          DB_ROOT=$(find /tmp/preflight-bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)
          if [ -z "$DB_ROOT" ]; then DB_ROOT=/tmp/preflight-bird/databases; fi
          test -d "$DB_ROOT"
          echo "DEV_JSON=$DEV_JSON" >> "$GITHUB_ENV"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
      - name: Validate M-Schema for all 100 cases without model inference
        run: |
          python -m experiments.preflight_xiyan_mschema \
            --source "$DEV_JSON" \
            --database-root "$DB_ROOT" \
            --frozen runs/bird-paired-dev-v4/paired.json

  treatment:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr

      - name: Start Ollama and pull XiYanSQL 7B
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull hf.co/wanhin/XiYanSQL-QwenCoder-7B-2504-gguf:Q4_K_M

      - name: Download pinned BIRD 2024-06-27 dev release
        run: |
          mkdir -p /tmp/bird
          curl -fL --retry 3 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          DEV_JSON=$(find /tmp/bird/unpacked -type f -name dev.json ! -path '*/__MACOSX/*' | head -n1)
          DB_ZIP=$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)
          test -n "$DEV_JSON"
          test -n "$DB_ZIP"
          mkdir -p /tmp/bird/databases
          unzip -q "$DB_ZIP" -d /tmp/bird/databases
          DB_ROOT=$(find /tmp/bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)
          if [ -z "$DB_ROOT" ]; then DB_ROOT=/tmp/bird/databases; fi
          echo "DEV_JSON=$DEV_JSON" >> "$GITHUB_ENV"
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"

      - name: Download exact 58/100 XiYan baseline shard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/baseline
          gh run download 37090833784 \
            --repo ${{ github.repository }} \
            --name xiyan-scv-shard-${{ matrix.shard }} \
            --dir /tmp/baseline
          test -f /tmp/baseline/xiyan-scv-shard-${{ matrix.shard }}.json

      - name: Run XiYan M-Schema treatment shard
        run: |
          python -m experiments.xiyan_mschema_frozen100 \
            --source "$DEV_JSON" \
            --database-root "$DB_ROOT" \
            --frozen runs/bird-paired-dev-v4/paired.json \
            --model hf.co/wanhin/XiYanSQL-QwenCoder-7B-2504-gguf:Q4_K_M \
            --baseline-results /tmp/baseline/xiyan-scv-shard-${{ matrix.shard }}.json \
            --shard-index ${{ matrix.shard }} \
            --num-shards 4 \
            --output xiyan-mschema-shard-${{ matrix.shard }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xiyan-mschema-shard-${{ matrix.shard }}
          path: xiyan-mschema-shard-${{ matrix.shard }}.json
          if-no-files-found: warn

  aggregate:
    needs: treatment
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@v4
        with:
          pattern: xiyan-mschema-shard-*
          path: shards
          merge-multiple: true

      - name: Compare M-Schema against frozen lexical 58
        run: |
          python -m experiments.merge_xiyan_mschema \
            --inputs shards/xiyan-mschema-shard-0.json shards/xiyan-mschema-shard-1.json shards/xiyan-mschema-shard-2.json shards/xiyan-mschema-shard-3.json \
            --output xiyan-mschema-frozen100.json \
            --min-correct 61

      - name: Verify frozen baseline identity
        run: |
          python - <<'PY'
          import json
          with open("xiyan-mschema-frozen100.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          assert payload["status"] == "complete"
          assert payload["sample_size"] == 100
          assert payload["baseline_lexical_ex"] == 58
          print(json.dumps({key: value for key, value in payload.items() if key != "cases"}, indent=2, ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xiyan-mschema-frozen100
          path: xiyan-mschema-frozen100.json
