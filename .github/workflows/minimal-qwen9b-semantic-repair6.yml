name: Minimal fixed-Qwen9B six-case semantic SQL repair (historical diagnostic)
on:
  push:
    branches: [research/qwen9b-typed-semantic-plan-verifier-20261121]
    paths: [.github/MINIMAL_QWEN9B_REPAIR6_START]
permissions: {contents: read, actions: read}
concurrency:
  group: one-shot-historical-qwen9b-repair6
  cancel-in-progress: false
env:
  QWEN_MODEL: qwen3.5:9b-q4_K_M
  DB_ZIP_SHA256: cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630
  SOURCE_SHA256: ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb
jobs:
  one_shot_repair:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11'}
      - name: Source-only tests, no inference
        run: |
          set -euo pipefail
          python -m pip install -q -e '.[dev]'
          python -m pytest -q tests/test_minimal_one_shot_qwen9b_repair6.py
      - name: Restore immutable gold-free 75 original Qwen SQL
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: kolihhan/semantic-text2sql-agent
          run-id: 44893556273
          github-token: ${{ github.token }}
          name: original-qwen9b-scv75-frozen-gold-free
          path: frozen
      - name: Source-only six-case preflight before model download
        run: |
          python - <<'PY'
          from pathlib import Path
          from evaluation.minimal_one_shot_qwen9b_repair6 import select
          s=select(Path('frozen/scv75-frozen-gold-free.json'))
          print('FROZEN_SIX_SOURCE_IDS',[c['case_id'] for c in s],flush=True)
          PY
      - name: Restore pinned BIRD SQLite databases
        run: |
          set -euo pipefail
          mkdir -p /tmp/bird
          curl -fL --retry 3 https://huggingface.co/datasets/HAL-9001/bird-dev/resolve/main/dev.zip -o /tmp/bird/dev.zip
          echo "$DB_ZIP_SHA256  /tmp/bird/dev.zip" | sha256sum -c -
          unzip -q /tmp/bird/dev.zip -d /tmp/bird/unpacked
          DB_ZIP=$(find /tmp/bird/unpacked -type f -name dev_databases.zip ! -path '*/__MACOSX/*' | head -n1)
          test -n "$DB_ZIP"
          mkdir -p /tmp/bird/databases
          unzip -q "$DB_ZIP" -d /tmp/bird/databases
          DB_ROOT=$(find /tmp/bird/databases -type d -name dev_databases ! -path '*/__MACOSX/*' | head -n1)
          if [ -z "$DB_ROOT" ]; then DB_ROOT=/tmp/bird/databases; fi
          echo "DB_ROOT=$DB_ROOT" >> "$GITHUB_ENV"
      - name: Install original Qwen3.5-9B Ollama model on CPU
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull "$QWEN_MODEL"
          python - <<'PY'
          from evaluation.qwen9b_typed_plan_exposed12 import _model_digest,QWEN_MODEL,QWEN_DIGEST
          assert _model_digest(QWEN_MODEL)==QWEN_DIGEST
          print('PINNED_QWEN35_9B_DIGEST_VALIDATED',flush=True)
          PY
      - name: One Qwen call per SQL, seal gold-blind decisions
        run: |
          set -euo pipefail
          mkdir -p blind
          python -m evaluation.minimal_one_shot_qwen9b_repair6 infer \
            --frozen frozen/scv75-frozen-gold-free.json \
            --db-root "$DB_ROOT" \
            --out blind/one-shot-6-blind.json
          python - <<'PY'
          import json
          d=json.load(open('blind/one-shot-6-blind.json'))
          assert d['status']=='SEALED_GOLD_BLIND_SIX' and len(d['cases'])==6
          assert d['no_reference_sql_in_inference']
          print('SIX_BLIND_MODEL_DECISIONS_SEALED',flush=True)
          PY
      - name: AFTER blind completion download gold and calculate physical SET and BAG EX
        run: |
          set -euo pipefail
          mkdir -p source scored
          curl -fLsS --retry 3 "https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/3c11fb193e5439b338e23677fa0aae11e8b85db9/data/dev_20251106-00000-of-00001.json?download=true" -o source/original-dev.json
          echo "$SOURCE_SHA256  source/original-dev.json" | sha256sum -c -
          python -m evaluation.minimal_one_shot_qwen9b_repair6 score \
            --frozen frozen/scv75-frozen-gold-free.json \
            --blind blind/one-shot-6-blind.json \
            --source source/original-dev.json --db-root "$DB_ROOT" \
            --out scored/one-shot-6-physical-strict-ex.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: historical-qwen9b-minimal-one-shot-six-diagnostic
          path: |
            blind/one-shot-6-blind.json
            scored/one-shot-6-physical-strict-ex.json
          retention-days: 30
          if-no-files-found: warn
